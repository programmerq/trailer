# On-demand "dev build" pipeline — produce unsigned, per-OS artifacts
# from ANY ref so manual/GUI testing can happen BEFORE merge.
#
# This is the delivery mechanism for pre-merge verification: it stages
# the same portable artifacts the Release pipeline ships (portable
# tarball / zip / .dmg) but uploads them to the workflow RUN instead of
# a GitHub Release, and it runs on any ref with NO VERSION/precheck gate
# (the whole point is building code that isn't release-ready yet).
#
# It deliberately does NOT edit release.yml — it REUSES release.yml's
# composite actions (.github/actions/setup-linux-build,
# .github/actions/setup-windows-cross) and build scripts
# (scripts/build-windows.sh, scripts/build-macos.sh) so a dev artifact
# is byte-for-byte the same recipe as the release one, minus the
# distro-package (.deb/.rpm/.msi) and UAT tiers, which don't affect the
# portable artifact a tester runs.
#
# Triggered by:
#   - workflow_dispatch: pick any ref/branch/SHA to build, and opt into
#     the macOS build per-run. That one runs on the owner's own
#     self-hosted Mac (see the dev-macos job) rather than a hosted
#     runner, so "opt in" is about not tying up a single-instance machine,
#     not about cost — standard hosted runners are free and unlimited on a
#     public repo, and this one isn't hosted at all.
#   - pull_request `labeled`: adding the `dev-build` label to a PR
#     builds its HEAD. Any other label is ignored by the `if:` filter.
#
# UNSIGNED: no signing secrets are required or used. scripts/build-macos.sh
# ad-hoc signs the .app (`codesign --sign -`, no identity), so the .dmg
# is Gatekeeper-adhoc, not Developer-ID signed — the same posture the
# Release pipeline ships today.

name: Dev Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: git ref/branch/SHA to build
        required: false
        type: string
        default: ''
      build_linux:
        description: build the Linux tar.gz artifact
        required: false
        type: boolean
        default: true
      build_windows:
        description: build the Windows zip artifact
        required: false
        type: boolean
        default: true
      build_macos:
        description: >-
          also build the macOS .dmg (runs on the owner's self-hosted Mac —
          opt in when you need it, so a single-instance machine isn't tied
          up by every dispatch)
        required: false
        type: boolean
        default: false
      enable_recorder:
        description: >-
          build with the UX recorder ON (-DTRAILER_ENABLE_UX_RECORDER=ON) —
          produces a recorder-enabled build for capture testing; default OFF
          so normal dev builds are unchanged. The macOS artifact is the one
          that matters; linux/windows build the stub backend.
        required: false
        type: boolean
        default: false
      run_macos_verification:
        description: >-
          On top of build_macos, also run the macOS on-demand verification
          steps: the GUI/WindowServer session capability probe (scripts/
          probe-macos-gui-session.sh), the Dock-recents system-store
          integration test (NSDocumentController round trip), and the
          adaptive-icon Assets.car dark/luminosity assertion (scripts/
          assert-adaptive-icon-variant.sh). No-op unless build_macos is
          also true (these steps live in the dev-macos job and need its
          build output). See the dev-macos job's steps for what each
          proves and does NOT prove.
        required: false
        type: boolean
        default: false
  pull_request:
    # `labeled` re-fires the workflow when a label is added to an
    # existing PR, so a dev-build doesn't require a fresh push after
    # labeling. The per-job `if:` filters to the `dev-build` label
    # specifically, so adding any other label is a no-op.
    types: [labeled]

# Minimal token: dev builds only read the tree + upload artifacts to
# the run (upload-artifact needs no extra permission).
permissions:
  contents: read

# Re-labeling / re-dispatching the same ref supersedes an in-flight
# run rather than stacking. github.ref is refs/pull/<n>/merge for the
# PR path and the selected branch for dispatch — one group per PR/ref.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

# Match release.yml's caps. See ci.yml's matching env comment for why
# every `cmake --build` step below passes the job count explicitly
# (`--parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"`) instead of a bare
# `--parallel` — the short version: bare `--parallel` does NOT honor
# this env var, and was the real cause of past OOMKilled pods — and for
# why the build level is 4 (one job per vCPU on a hosted runner) while
# the ctest level deliberately stays at 2.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 2

jobs:
  dev-linux:
    # Run on manual dispatch when build_linux is checked (default on), or
    # when the `dev-build` label specifically is added to a PR (any other
    # label fires `labeled` too but is filtered out here).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_linux) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'dev-build')
    name: Linux dev build
    # ubuntu-latest, NOT a self-hosted label. This job is reachable from a
    # `pull_request` (the `dev-build` label path above) and checks out
    # `github.event.pull_request.head.sha` — i.e. it executes PR-authored
    # code. On a public repo that must never land on the owner's own
    # infrastructure. See PR "CI: move every PR-reachable job to
    # GitHub-hosted runners" (2026-08-05).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` yields a real
          # commit count for the git-derived dev version (depth 1 -> 1).
          fetch-depth: 0
          # Dispatch: build inputs.ref, or (empty default) the ref the
          # run was dispatched on. Labeled PR: build the PR HEAD sha.
          # In GH expressions `A && B || C` yields B when A is true and
          # B is truthy, else C: pull_request -> head.sha; dispatch ->
          # inputs.ref ('' means "checkout the triggering ref", which is
          # actions/checkout's default-ref behavior).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Share the release job's ccache prefix for warm hits (the
          # action restores by prefix and saves a fresh per-run entry,
          # so this reads release's warm cache without clobbering it).
          key: release-${{ runner.os }}-gcc-linux
          max-size: 500M
          update-package-index: true

      - name: Configure
        # Mirrors release.yml's linux-build. TRAILER_WERROR stays OFF
        # (Qt / libstdc++ / qpdf system-header warning noise). enable_recorder
        # (dispatch opt-in) builds the stub recorder backend on Linux; empty on
        # the label path resolves to OFF, so default builds are unchanged.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DTRAILER_ENABLE_UX_RECORDER=${{ inputs.enable_recorder && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"

      - name: Unit tests
        # Dev builds exist to GUI-test WIP code, which may legitimately
        # have red tests. Run the suite for signal (the result is visible
        # in the run), but continue-on-error so a failure does NOT block
        # the artifact upload below. Release keeps its tests blocking.
        continue-on-error: true
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Stage Linux artifact
        # Same portable tarball shape as release.yml's linux-build on main:
        # the first-party LICENSE plus THIRD_PARTY_LICENSES.md, PHILOSOPHY.md,
        # and README.md, plus the verbatim third-party license bundle
        # (`licenses/third-party/`). #61 landed on main, so release.yml now
        # copies licenses/third-party into its portable staging dir — this
        # step mirrors it (and the Windows one below) for parity.
        run: |
          set -euo pipefail
          mkdir -p dist/trailer-linux-x86_64
          cp build/trailer dist/trailer-linux-x86_64/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-linux-x86_64/
          # Ship the verbatim upstream dependency license texts alongside
          # the portable binary so the tarball carries the same third-party
          # attribution the .deb/.rpm install under share/doc/trailer.
          cp -r licenses/third-party dist/trailer-linux-x86_64/
          (cd dist && tar -czf trailer-linux-x86_64.tar.gz trailer-linux-x86_64)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-trailer-linux-x86_64
          path: dist/trailer-linux-x86_64.tar.gz
          retention-days: 14

  dev-windows:
    # Run on manual dispatch when build_windows is checked (default on),
    # or on the `dev-build` label (see dev-linux for the label rationale).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_windows) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'dev-build')
    name: Windows dev cross-build (mingw-w64)
    # ubuntu-latest, NOT a self-hosted label — same reason as dev-linux
    # above: this job is `pull_request`-reachable and builds PR-authored
    # code.
    runs-on: ubuntu-latest
    # Cold Wine/Qt/qpdf provisioning is slow before the caches warm —
    # keep the release job's headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` yields a real
          # commit count for the git-derived dev version (depth 1 -> 1).
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ref }}

      - uses: ./.github/actions/setup-windows-cross

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Share the release windows-cross ccache prefix for warm hits.
          key: release-windows-cross-mingw
          max-size: 500M
          update-package-index: true

      - name: Configure
        # Identical invocation to release.yml's windows-cross Configure:
        # the repo mingw toolchain file, the ORT FetchContent-source
        # override the k8s egress policy forces, and the ccache launcher.
        run: >-
          cmake -S . -B build-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw-w64.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH="$QT_WIN_DIR;$QPDF_DIR"
          -DQT_HOST_PATH="$QT_HOST_DIR"
          -Dqpdf_DIR="$QPDF_DIR/lib/cmake/qpdf"
          -DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME_PREBUILT="$ORT_WIN_DIR"
          -DTRAILER_ENABLE_UX_RECORDER=${{ inputs.enable_recorder && 'ON' || 'OFF' }}
        env:
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig

      - name: Build
        run: cmake --build build-win --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"

      - name: Bundle self-contained trailer.exe
        # Reuse scripts/build-windows.sh's collect_dlls import-table walk
        # (--in-container skips its configure branch since build-win/
        # already exists). imageformats/ is added on top because the
        # JPEG export plugin loads at runtime and the import walk can't
        # see runtime-loaded plugins. Mirrors release.yml's current
        # portable bundle on main (first-party LICENSE + THIRD_PARTY_-
        # LICENSES.md + PHILOSOPHY.md + README.md + the verbatim
        # `licenses/third-party/` bundle). #61 landed, so release.yml now
        # copies licenses/third-party into the zip staging dir — this
        # mirrors it for parity (see the dev-linux note).
        run: |
          set -euo pipefail
          BUILD_DIR="$PWD/build-win" \
          OUT_DIR="$PWD/dist/trailer-windows-x86_64" \
          QT_DIR="$QT_WIN_DIR" \
          QT_HOST_DIR="$QT_HOST_DIR" \
          QPDF_DIR="$QPDF_DIR" \
            bash scripts/build-windows.sh --in-container
          mkdir -p dist/trailer-windows-x86_64/imageformats
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll dist/trailer-windows-x86_64/imageformats/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-windows-x86_64/
          # Ship the verbatim upstream dependency license texts inside the
          # portable zip too, matching what the .msi installs under
          # licenses\third-party\.
          cp -r licenses/third-party dist/trailer-windows-x86_64/

      - name: Stage Windows artifact
        # Same flat, root-level zip release.yml produces (trailer.exe at
        # the zip root). 7z ships via setup-windows-cross (p7zip-full).
        run: |
          set -euo pipefail
          (cd dist/trailer-windows-x86_64 && 7z a -tzip ../trailer-windows-x86_64.zip .)

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-trailer-windows-x86_64
          path: dist/trailer-windows-x86_64.zip
          retention-days: 14

  dev-macos:
    # Opt-in per DISPATCH only: it requires the build_macos checkbox on a
    # manual dispatch and never runs on the label path. The reason is no
    # longer cost (that was the "macOS bills at ~10x" era; standard hosted
    # runners are free and unlimited on a public repo, and this job isn't
    # hosted at all) — it is that this lane is a SINGLE-INSTANCE machine,
    # so every PR label must not queue on it.
    #
    # That opt-in is also load-bearing for SECURITY — see the runs-on
    # comment below: `github.event_name == 'workflow_dispatch'` is the
    # first term, so a `pull_request` can never schedule this job.
    # (The `&& inputs.build_macos` short-circuits after
    # the event check, so the label path — where inputs is absent —
    # never evaluates it.)
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos == true
    name: macOS dev .dmg build (Apple Silicon, unsigned)
    # SETTLED (2026-08-05): this job stays on the owner's self-hosted M4
    # MacBook Pro runner, permanently — it is no longer the 2026-07-24
    # "trial" it started as. It is the ONE lane that carries the checks a
    # fresh, ephemeral, headless hosted VM structurally cannot answer: the
    # GUI/WindowServer session capability probe, the Dock-recents
    # system-store integration test (it writes to and restores THIS
    # machine's real NSDocumentController Recents list), and the
    # adaptive-icon Assets.car `assetutil` assertion — plus the owner's own
    # current Xcode. See the `run_macos_verification` steps below.
    #
    # nightly.yml's macOS lane moved the OTHER way on the same date (to
    # GitHub-hosted macos-14): an unattended, timer-fired nightly must not
    # depend on when a laptop lid opens. The split is the point — the
    # laptop keeps doing what only it can do, and nightlies stop waiting
    # on it.
    #
    # Lesson learned mid-trial: `runners-Virtual-Machine` is this
    # runner's registered NAME, not a label — `runs-on: runners-Virtual-Machine`
    # matches nothing and queues forever (see run 30065862397, never
    # picked up). Self-hosted runners are targeted by their `labels:`
    # array; this runner's actual labels are self-hosted, macOS, ARM64
    # (no custom label such as `utm`).
    #
    # SECURITY (2026-08-05, public repo): this is the ONLY job left in the
    # repo on a self-hosted runner, and it is safe to leave here because
    # the `if:` above makes it `workflow_dispatch`-ONLY. The `pull_request`
    # (labeled) path can never reach it — `github.event_name ==
    # 'workflow_dispatch'` is the first term and short-circuits — so no
    # PR-authored code can execute on the owner's hardware. If that `if:`
    # is ever widened to include a `pull_request` branch, this job MUST
    # move to `macos-14` first.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    outputs:
      # Populated only when run_macos_verification is true (the steps that
      # set them are `if:`-gated below); empty string otherwise. Read back
      # by whichever process dispatched this run (via the Actions API) to
      # compose a findings report — see the macOS Dock-menu-and-icon PR.
      gui_probe_summary: ${{ steps.gui_probe.outputs.summary }}
      dock_recents_integration_result: ${{ steps.dock_recents_integration.outputs.result }}
      icon_variant_assertion_result: ${{ steps.icon_variant_assertion.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git rev-list --count HEAD` yields a real
          # commit count for the git-derived dev version (depth 1 -> 1).
          fetch-depth: 0
          # macOS only runs on dispatch, so the ref is always inputs.ref
          # (or its '' default -> the dispatched ref).
          ref: ${{ inputs.ref }}

      - name: Add Homebrew to PATH
        # TRIAL fix (2026-07-24): the self-hosted runner (an Apple Silicon
        # M4 VM) has Homebrew installed at its standard arm64 prefix
        # (/opt/homebrew), but the actions-runner service process's own
        # environment doesn't inherit the interactive shell's PATH, so
        # `brew`/`cmake`/`ninja` were all invisible to job steps
        # ("brew: command not found", exit 127 — see run 30070206290)
        # even though genuinely installed on the VM. Homebrew symlinks
        # every formula's binaries into this one prefix, so prepending it
        # once here covers brew + cmake + ninja for the rest of the job.
        # GitHub-hosted macos-14 runners don't need this (their images
        # ship Homebrew already on PATH), so this step is a no-op there
        # if this job is ever pointed back at macos-14 (`brew --prefix`
        # on Intel image `/usr/local` — this /opt/homebrew path is
        # arm64-specific to this runner).
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        # Same pin as release.yml's macos-build / setup-linux-build so
        # the dev .app links against identical Qt. Exports $QT_ROOT_DIR
        # which scripts/build-macos.sh consumes.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          modules: 'qtpdf'
          cache: true

      - name: Install build deps
        run: brew install ninja

      - name: Build, bundle, and package
        # scripts/build-macos.sh is the source of truth for the macOS
        # build (verbatim reuse of release.yml's macos-build step). It
        # ad-hoc signs the bundle (`codesign --deep --force --sign -`,
        # no identity) and needs NO signing secrets, so the dev .dmg is
        # Gatekeeper-adhoc — unsigned in the Developer-ID sense — with
        # zero extra flags. This is the same posture release ships today.
        #
        # enable_recorder (dispatch opt-in, default false) flips the recorder
        # on via the env var build-macos.sh reads. Empty on the label path
        # (inputs absent) -> recorder OFF, unchanged default behaviour.
        run: scripts/build-macos.sh
        env:
          TRAILER_ENABLE_UX_RECORDER: ${{ inputs.enable_recorder }}

      # --- On-demand macOS verification (run_macos_verification opt-in) ---
      # Three independent, on-demand checks added for the macOS Dock-menu-
      # and-icon PR, kept opt-in (not part of every dev-macos dispatch)
      # because they change real, persistent state on the single-instance
      # self-hosted runner (the GUI probe compiles+runs a throwaway helper;
      # the Dock-recents test writes-then-restores the runner's REAL system
      # Recent Documents list — see its own test-file comment) or take
      # meaningfully longer than a plain build. Each step is independently
      # useful beyond this one PR — see each step's own comment for what it
      # proves and does not prove.
      - name: GUI/WindowServer session capability probe
        # Standing infrastructure question, not PR-specific: does this
        # runner have a real Aqua session (unlocking on-screen UI testing,
        # real screenshots, real Dock/Gatekeeper behaviour), or does it run
        # headless/daemon-only (offscreen stays mandatory for everything
        # GUI)? Never fails the job — see the script's own header for the
        # five signals it reports and why none of them gates.
        if: inputs.run_macos_verification == true
        id: gui_probe
        run: |
          set -uo pipefail
          scripts/probe-macos-gui-session.sh "build-macos/tests/test_dock_recents" \
            | tee /tmp/gui_probe.log
          {
            echo "summary<<TRAILER_EOF"
            cat /tmp/gui_probe.log
            echo "TRAILER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dock-recents system-store integration test (opt-in, real state)
        # Priority-1 automation per the owner's ask: mechanically proves
        # Part 1's "works when Trailer isn't running" claim by writing to,
        # then reading back from, the REAL NSDocumentController system
        # Recent Documents store (tests/test_dock_recents.cpp's
        # macosSystemRecentsRoundTrip, gated by
        # TRAILER_MACOS_TOUCH_SYSTEM_RECENTS=1). Does NOT prove the Dock
        # actually renders the menu (native Dock chrome — unobservable
        # here); proves the persisted data it would render from is
        # correct. The test itself snapshots and restores this machine's
        # real prior state regardless of pass/fail (see its
        # SystemRecentsRestoreGuard), so this step is safe to run on the
        # shared runner — but is still opt-in here because it is the most
        # state-touching step in this job.
        if: inputs.run_macos_verification == true
        id: dock_recents_integration
        # Non-gating for THIS job (still uploads the .dmg either way) —
        # the failure/pass signal is what this dispatch exists to surface,
        # not something that should also swallow the build artifact.
        continue-on-error: true
        working-directory: build-macos
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen TRAILER_MACOS_TOUCH_SYSTEM_RECENTS=1 \
            ./tests/test_dock_recents 2>&1 | tee /tmp/dock_recents_integration.log
          RC=${PIPESTATUS[0]}
          {
            echo "### Dock-recents system-store integration test"
            echo
            echo '```'
            cat /tmp/dock_recents_integration.log
            echo '```'
            echo
            echo "Exit code: $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail (exit $RC)" >> "$GITHUB_OUTPUT"
          fi
          exit "$RC"

      - name: Adaptive-icon Assets.car dark/luminosity assertion (opt-in)
        # Priority-2 automation per the owner's ask: promotes the
        # mechanical half of scripts/build-macos.sh's existing informational
        # check to a real, hard assertion — see scripts/assert-adaptive-
        # icon-variant.sh's header for the load-bearing distinction (proves
        # the ARTIFACT contains a dark/luminosity marker; does NOT prove
        # macOS renders it). Kept out of scripts/build-macos.sh itself (and
        # so out of every real release/nightly build) because the exact
        # assetutil key/value shape this asserts on was never empirically
        # confirmed against real Tahoe actool output before now — this
        # step both confirms/corrects it AND is the assertion in one place.
        if: inputs.run_macos_verification == true
        id: icon_variant_assertion
        # Non-gating for THIS job, same rationale as the step above.
        continue-on-error: true
        run: |
          set +e
          scripts/assert-adaptive-icon-variant.sh \
            "build-macos/Trailer.app/Contents/Resources/Assets.car" \
            2>&1 | tee /tmp/icon_variant.log
          RC=${PIPESTATUS[0]}
          {
            echo "### Adaptive-icon Assets.car assertion"
            echo
            echo '```'
            cat /tmp/icon_variant.log
            echo '```'
            echo
            echo "Exit code: $RC"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail (exit $RC)" >> "$GITHUB_OUTPUT"
          fi
          exit "$RC"
      # --- End on-demand macOS verification ---

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-trailer-macos-arm64
          path: dist/trailer-macos-arm64.dmg
          retention-days: 14
