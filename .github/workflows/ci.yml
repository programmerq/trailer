# Fast-feedback CI: lint + unit tests on Linux. Runs on every PR and on
# pushes to main. The full cross-compile to Linux + Windows artifacts
# lives in `release.yml` and only fires on tag pushes — it's slow
# (Docker image build, mingw cross-link, dependency walk) and not worth
# waiting through for every commit.
#
# Both CI and the release pipeline build with TRAILER_WERROR=OFF.
# GCC's -Wnull-dereference and -Werror=cpp fire from inside Qt,
# libstdc++, and qpdf headers — system-header noise we can't fix
# locally without patching upstream. Warnings still print in the
# build log; trailer's own source is kept clean by review.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit lands on the same ref —
# stops PR pushes from queueing up minutes of stale builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux build + unit tests
    runs-on: ubuntu-24.04
    # Short on purpose — prefer fast fail over patient hang. The
    # setup-linux-build action installs mold + ninja so the build
    # uses them by default (~3× faster linking, better parallel job
    # scheduling than make). ccache hits bring warm runs well under
    # 5 min; first cold runs land around 12-14 min. Bump if the
    # post-Qt-bump cold time consistently overshoots.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ runner.os }}-gcc
          # Cache lives across branches; the action keys by commit and
          # falls back to the closest ancestor, so warm runs skip
          # recompiling unchanged files.
          max-size: 500M

      - name: Configure
        # Warnings-only: TRAILER_WERROR defaults OFF (see workflow
        # header for why).
        #
        # -G Ninja: ninja's scheduler beats make at filling cores when
        #    AUTOMOC's variable-cost steps land between compile units.
        # -fuse-ld=mold: drops the link phase from minutes (ld.bfd) to
        #    seconds. Especially valuable here because each test_*
        #    binary links separately against trailer_core + Qt + ONNX.
        # TRAILER_ENABLE_UX_RECORDER=ON: compiles the developer UX
        #    recorder (platform-neutral core + the non-macOS stub
        #    backend) and runs its unit tests so the dev-only feature
        #    doesn't bit-rot — same reasoning as building the tools/
        #    binaries everywhere. The option stays OFF by default and
        #    in the release pipeline, so shipped artifacts never
        #    include it; the Windows CI job and test_ux_record_facade
        #    keep the disabled configuration covered.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
          -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold
          -DTRAILER_ENABLE_UX_RECORDER=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        # UAT tests (label `uat`) drive the full Application +
        # MainWindow stack and need a windowed Qt platform plugin. The
        # fast PR loop excludes them; they run on tag via release.yml's
        # UAT step or manually via uat-dispatch.yml.
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

  build-and-test-windows:
    name: Windows build + unit tests (MSVC)
    runs-on: windows-2022
    # Native Windows build path. Mirrors what scripts/build-windows-native.ps1
    # does locally: aqtinstall Qt + qpdf MSVC prebuilt + MSVC 2022 +
    # ninja → ctest. This catches Windows-only regressions before
    # release (the cross-build via mingw in release.yml uses a
    # different toolchain and can paper over MSVC-specific issues
    # like the QTemporaryFile-vs-qpdf write conflict).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        # Pinned to 6.10.3 because aqtinstall 3.3.0 / install-qt-action
        # don't yet handle the toolchain-suffixed directory layout Qt
        # 6.11.x uses on download.qt.io. Bump in lockstep with
        # .github/actions/setup-linux-build once aqt fixes that.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtpdf'
          cache: true

      - name: Install qpdf (MSVC prebuilt)
        # Microsoft Visual C++ prebuilt zip from the upstream qpdf
        # release page. Match the version that scripts/install-windows-
        # deps.ps1 defaults to so a green CI run matches what local
        # developers see.
        shell: pwsh
        run: |
          $qpdfVersion = '12.3.2'
          $zip = "qpdf-$qpdfVersion-msvc64.zip"
          Invoke-WebRequest "https://github.com/qpdf/qpdf/releases/download/v$qpdfVersion/$zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath . -Force
          Move-Item "qpdf-$qpdfVersion-msvc64" "$env:GITHUB_WORKSPACE/qpdf"
          # Make qpdf's bin discoverable for ctest (Qt's bin is added
          # by install-qt-action via QT_ROOT_DIR + Path edits).
          "$env:GITHUB_WORKSPACE\qpdf\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        # Ninja is the right generator on Windows too: it parallelises
        # AUTOMOC + compile better than MSBuild on a small project,
        # and the resulting CMakeCache lines up with what
        # scripts/build-windows-native.ps1 produces locally. We don't
        # use ccache here — sccache would be the Windows equivalent
        # but the cold build is fast enough (<2 min on the runner)
        # that the cache-management cost isn't worth it yet.
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$env:GITHUB_WORKSPACE/qpdf"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        # QT_QPA_FONTDIR is set so QPdfWriter has access to Arial etc.
        # under the offscreen platform plugin. Without this, Qt 6 on
        # Windows draws text as filled vector paths and search-related
        # tests can't find anything in the generated PDFs. See the
        # comment in tests/uat/CMakeLists.txt.
        working-directory: build
        shell: pwsh
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts

  clang-format:
    name: clang-format (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    # Advisory only — output goes to the job summary so the diff is
    # visible without bouncing merges. Flip to required once the tree
    # is reliably formatted (post-1.0 / when a pre-commit hook lands).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        # Pinned to v14 to match scripts/run-uat.sh and the maintainer's
        # local toolchain. Available in noble universe.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - name: Run clang-format
        shell: bash
        run: |
          set +e
          OUTPUT=$(git ls-files '*.cpp' '*.h' '*.mm' \
            | xargs clang-format-14 --dry-run --Werror 2>&1)
          EXIT=$?
          if [ "$EXIT" -ne 0 ]; then
            {
              echo "## clang-format diff"
              echo ""
              echo "Files below need a re-format. Run locally:"
              echo ""
              echo '```sh'
              echo "git ls-files '*.cpp' '*.h' '*.mm' \\"
              echo "  | xargs clang-format-14 -i"
              echo '```'
              echo ""
              echo "### clang-format output"
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::clang-format reported issues — see job summary"
          else
            echo "clang-format: clean ✓"
          fi
