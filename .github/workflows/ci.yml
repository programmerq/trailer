# Fast-feedback CI: lint + unit tests on Linux. Runs on every PR
# and on pushes to main. The full cross-compile to Linux + Windows
# artifacts lives in `release.yml` and only fires on tag pushes —
# it's slow (Docker image build, mingw cross-link, dependency
# walk) and not worth waiting through for every commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Linux build + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtpdf'
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libcups2-dev \
            pkg-config \
            libqpdf-dev

      - name: Configure
        # The CompilerWarnings.cmake module enables -Wall -Wextra
        # -Wpedantic and treats everything as an error in the
        # trailer_core target — the build itself is the lint gate.
        # Adding clang-format / clang-tidy passes is a follow-up
        # once the project has a committed style config.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        # UAT tests (label `uat`) drive the full Application +
        # MainWindow stack and need a windowed Qt platform plugin.
        # The fast PR loop excludes them; they run on tag via
        # release.yml's UAT step.
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen
