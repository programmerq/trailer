# Fast-feedback CI: lint + unit tests on Linux. Runs on every PR
# and on pushes to main. The full cross-compile to Linux + Windows
# artifacts lives in `release.yml` and only fires on tag pushes —
# it's slow (Docker image build, mingw cross-link, dependency
# walk) and not worth waiting through for every commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Linux build + unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-build

      - name: clang-format
        run: git ls-files '*.cpp' '*.h' '*.mm' | xargs clang-format-14 --dry-run --Werror

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTRAILER_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        # UAT tests (label `uat`) drive the full Application +
        # MainWindow stack and need a windowed Qt platform plugin.
        # The fast PR loop excludes them; they run on tag via
        # release.yml's UAT step or manually via uat-dispatch.yml.
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen
