name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-13]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtpdf'
          cache: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libcups2-dev \
            pkg-config \
            libqpdf-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install qpdf pkg-config

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: vcpkg install qpdf:x64-windows
        shell: pwsh

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt DLLs for tests (Windows)
        if: runner.os == 'Windows'
        # windeployqt copies the platform plugin (qoffscreen.dll) and any other
        # Qt DLLs needed at runtime into the same directory as the test binaries,
        # so the offscreen QPA platform is discoverable without a full Qt install
        # in PATH.
        run: |
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw --release build/Release/test_adapters.exe
          # Explicitly include the offscreen platform plugin (used in CI headless
          # tests via QT_QPA_PLATFORM=offscreen) which windeployqt omits by default.
          New-Item -ItemType Directory -Force build/Release/platforms | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreen.dll" build/Release/platforms/
        shell: pwsh

      - name: Test
        working-directory: build
        # UAT tests are labelled `uat` and run locally via
        # scripts/run-uat.sh on tag. Exclude them from the commit/PR CI.
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen
