# Fast-feedback CI: lint + unit tests on Linux. Runs on every PR and on
# pushes to main. The full cross-compile to Linux + Windows artifacts
# lives in `release.yml` and only fires on tag pushes — it's slow
# (Docker image build, mingw cross-link, dependency walk) and not worth
# waiting through for every commit.
#
# Both CI and the release pipeline build with TRAILER_WERROR=OFF.
# GCC's -Wnull-dereference and -Werror=cpp fire from inside Qt,
# libstdc++, and qpdf headers — system-header noise we can't fix
# locally without patching upstream. Warnings still print in the
# build log; trailer's own source is kept clean by review.

name: CI

# Least privilege: every job here only checks out the repo and uploads
# artifacts (which needs no extra token scope), so the workflow's
# GITHUB_TOKEN gets read-only repository access and nothing else.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # If build-and-test, wayland-smoke, or clang-format ever become
    # *required* checks, path-skipped PRs would hang on "Expected" — pair
    # this with a same-name no-op workflow on the inverse paths, or drop
    # paths-ignore. This is one reason wayland-smoke should stay a
    # non-required (advisory) check for now (see docs/ci/wayland-tier.md).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel an in-progress run when a new commit lands on the same ref —
# stops PR pushes from queueing up minutes of stale builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cap build/test parallelism on the self-hosted trailer-k8s pods.
#
# CORRECTED (2026-07-26): a bare `cmake --build … --parallel` (no
# following number) does NOT honor this env var — CMake only consults
# CMAKE_BUILD_PARALLEL_LEVEL when `--parallel`/`-j` is absent from the
# command line entirely. Once `--parallel` appears, with or without a
# value, CMake tells the native build tool to use ITS OWN default —
# for GNU Make that means a bare `-j`, i.e. UNLIMITED concurrent jobs,
# which is what was actually OOMKilling pods here even with this env
# var set. Every `cmake --build` step below now passes the job count
# explicitly (`--parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"`) so the
# cap is real regardless of whether the env var is read. See the fix
# PR (claude/fix-unbounded-build-parallelism) for the `ps --forest`
# evidence. CTEST_PARALLEL_LEVEL is unaffected — ctest honors its env
# var normally with or without an explicit `-j` on its command line.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2

jobs:
  version-gating:
    # Fast, dependency-free gate: exercise the real shipped
    # scripts/test-version-gating.sh, which asserts both the release-
    # ready gate regex (kept in lockstep with release.yml + release-
    # autotag.yml) and scripts/bump-version.sh's -dev.N behaviour.
    # Needs nothing but bash + coreutils, so it stays off the heavy
    # build path and fails the workflow the moment the regex drifts.
    name: Version gating
    runs-on: trailer-small
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Run version-gating regression tests
        run: bash scripts/test-version-gating.sh
      - name: Run UAT-ratchet regression tests
        # scripts/compare-uat-baseline.sh decides whether a nightly's UAT
        # result reds the run. It originally shipped with its fixture
        # matrix recorded only in a PR body, and the rule then drifted
        # into calling an added-but-failing test a REGRESSION (see that
        # script's header). The matrix is committed now and runs here,
        # for the same reason version gating does: bash + coreutils only,
        # so it can gate every PR without touching the build path.
        run: bash scripts/test-compare-uat-baseline.sh

  build-and-test:
    name: Linux build + unit tests
    runs-on: trailer-k8s
    # Prefer fast fail over patient hang, but the first cold-cache build
    # on the self-hosted trailer-k8s runners overran 18 min and got
    # cancelled before ccache was populated. The setup-linux-build action
    # installs mold + ninja so the build uses them by default (~3× faster
    # linking, better parallel job scheduling than make). ccache hits
    # bring warm runs well under 5 min; the first cold run needs headroom
    # to finish and seed the cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ci-${{ runner.os }}-gcc
          # Cache lives across branches; the action keys by commit and
          # falls back to the closest ancestor, so warm runs skip
          # recompiling unchanged files.
          max-size: 500M
          # Custom trailer-runner image ships an empty apt index, so the
          # action must run `apt-get update` before `apt-get install ccache`.
          update-package-index: true

      - name: Configure
        # Warnings-only: TRAILER_WERROR defaults OFF (see workflow
        # header for why).
        #
        # -G Ninja: ninja's scheduler beats make at filling cores when
        #    AUTOMOC's variable-cost steps land between compile units.
        # -fuse-ld=mold: drops the link phase from minutes (ld.bfd) to
        #    seconds. Especially valuable here because each test_*
        #    binary links separately against trailer_core + Qt + ONNX.
        # TRAILER_ENABLE_UX_RECORDER=ON: compiles the developer UX
        #    recorder (platform-neutral core + the non-macOS stub
        #    backend) and runs its unit tests so the dev-only feature
        #    doesn't bit-rot — same reasoning as building the tools/
        #    binaries everywhere. The option stays OFF by default and
        #    in the release pipeline, so shipped artifacts never
        #    include it; the Windows CI job and test_ux_record_facade
        #    keep the disabled configuration covered.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
          -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold
          -DTRAILER_ENABLE_UX_RECORDER=ON

      - name: Build
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"

      - name: Unit tests
        # UAT tests (label `uat`) drive the full Application +
        # MainWindow stack and need a windowed Qt platform plugin. The
        # fast PR loop excludes them; they run on tag via release.yml's
        # UAT step or manually via uat-dispatch.yml.
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

  wayland-smoke:
    name: Wayland launch + screenshot smoke
    runs-on: trailer-k8s
    # Least privilege: this job checks out, builds, and uploads one PNG
    # artifact — no extra token scope beyond the workflow-level read.
    permissions:
      contents: read
    # Modest wall-time by design (the owner is minutes-conscious): this job
    # BUILDS ONLY the `trailer` target (not the test binaries) and runs ONE
    # launch-and-screenshot smoke — no unit re-run, no UAT. With the Linux
    # job's warm ccache it lands well under the Linux tier's time; the cold
    # first run needs the same headroom the Linux build documents.
    timeout-minutes: 40
    #
    # WHY this tier exists, and WHY it is launch+screenshot ONLY:
    # ---------------------------------------------------------------------
    # This is the ONE check that proves Trailer loads the *wayland* Qt
    # platform plugin, maps a real xdg-shell surface on a real compositor,
    # and paints actual UI into it. Offscreen unit tests and the Wine tier
    # structurally cannot prove that. See docs/ci/wayland-tier.md.
    #
    # The unit suite and UAT are DELIBERATELY NOT run under Wayland here
    # (they stay on offscreen in the build-and-test / release jobs), for
    # honest, documented reasons from the Phase 1 investigation:
    #   * Unit suite under Wayland is 57/60, not 60/60. `test_dirty_marker_zoom`
    #     HANGS: MainWindow::closeEvent (src/ui/MainWindow.cpp:4432)
    #     auto-accepts the unsaved-changes modal ONLY under offscreen/minimal;
    #     under wayland it shows the real Save/Discard/Cancel dialog and blocks
    #     forever with no user. `test_image_scale` fails on fractional-scaling
    #     rounding (real-compositor DPR vs offscreen dpr=1), and
    #     `test_perf_freehand_repaint` is a wall-time perf budget that is noise
    #     under a compositor (the same `perf` tier the Wine job drops).
    #   * UAT can't even be pointed at Wayland yet: tests/uat/CMakeLists.txt:15
    #     forces QT_QPA_PLATFORM=offscreen as an unconditional per-test
    #     ENVIRONMENT property (overriding an ambient wayland), and the same
    #     modal hang hits 5 UAT binaries.
    # Moving those under Wayland needs the Phase 3 modal-skip fix + a UAT
    # platform opt-in first; gating a fast PR loop on a known modal hang would
    # be dishonest bookkeeping. This mirrors the Wine tier's honest
    # `--label-exclude 'uat|perf'` exclusion, stated inline rather than hidden.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # OWN key (…-gcc-wayland), distinct from build-and-test's ci-…-gcc.
          # Both jobs use native gcc so the objects are compatible, but this job
          # builds ONLY `--target trailer` (a subset of build-and-test's full
          # tree). The two jobs run concurrently (no `needs:`), and the action
          # restores by key prefix + saves under a timestamped key — so if they
          # shared a key, this partial build's cache save could win the restore
          # race and degrade build-and-test's hit rate. A separate key keeps
          # each job's cache self-consistent; it warms independently from the
          # cross-branch fallback the action already does within a key.
          key: ci-${{ runner.os }}-gcc-wayland
          max-size: 500M
          # Custom trailer-runner image ships an empty apt index, so the
          # action must run `apt-get update` before `apt-get install ccache`.
          update-package-index: true

      - name: Install sway + grim
        # Per-run apt install, mirroring the Wine tier's per-run toolchain
        # install: docker/runner/Dockerfile BAKES these for later, but until
        # that image is rebuilt + the ARC runner-set repointed, install them
        # here so the job is green WITHOUT waiting for an image rebuild. Skips
        # the apt work when the packages are already present (custom image).
        #
        # sway drags a real dependency tree through the egress proxy on every
        # run until it is baked into the runner image, so a single proxy hiccup
        # could red-gate unrelated PRs. Wrap update+install in a bounded retry
        # with backoff (same resilience the toolchain installs use) to ride out
        # a transient failure. Until sway+grim are baked in, this job SHOULD be
        # kept a NON-REQUIRED (advisory) status check in branch protection —
        # see docs/ci/wayland-tier.md.
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for pkg in sway grim; do
            if dpkg -s "$pkg" >/dev/null 2>&1; then
              echo "  preinstalled (skipped): $pkg"
            else
              echo "  will install via apt:   $pkg"
              missing+=("$pkg")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sway + grim preinstalled — skipping apt-get."
          else
            n=0
            until [ "$n" -ge 3 ]; do
              if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
                break
              fi
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "::error::apt-get failed to install ${missing[*]} after 3 attempts (egress-proxy hiccup?)"
                exit 1
              fi
              echo "apt-get attempt $n failed — retrying in $((n*5))s..."
              sleep "$((n*5))"
            done
          fi

      - name: Configure
        # Identical invocation to build-and-test so ccache objects hit. See
        # that job for the flag-by-flag rationale (Ninja, mold, UX recorder).
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold
          -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold
          -DTRAILER_ENABLE_UX_RECORDER=ON

      - name: Build trailer binary only
        # Just the app — not the test_* binaries — to keep wall-time modest.
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}" --target trailer

      - name: Wayland launch + screenshot smoke
        # Starts sway headless (pixman), launches build/trailer under
        # QT_QPA_PLATFORM=wayland on a sample image, hard-gates that a surface
        # maps, then poll-captures with grim until a non-blank 1280x800 frame
        # lands. Self-contained: it uses ImageMagick `identify` when present and
        # falls back to a stdlib Python PNG analyzer otherwise. Deterministic
        # hard oracle — but keep it a NON-REQUIRED status check until sway+grim
        # are baked into the runner image (see docs/ci/wayland-tier.md).
        run: bash scripts/wayland-smoke.sh
        env:
          WAYLAND_SMOKE_OUT: ${{ github.workspace }}/wayland-smoke.png
          # Point the smoke at the SAME Qt the build used. install-qt-action
          # (setup-linux-build) exports QT_ROOT_DIR to the job env; its plugins
          # dir ships libqwayland.so. The script's own auto-detect can miss the
          # CI Qt layout, so pass this explicitly — the script then hard-asserts
          # libqwayland is present under it before launching.
          QT_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}/plugins

      - name: Upload Wayland screenshot
        # Always upload so a failure's capture is inspectable too.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wayland-smoke-screenshot
          path: wayland-smoke.png
          retention-days: 30
          if-no-files-found: warn

  windows-cross-build:
    name: Windows cross-build + Wine unit tests
    # Runs directly on the self-hosted trailer-k8s pods — NO Docker
    # (the pods have no Docker daemon, so release.yml's Docker-based
    # windows-cross job can't run here). The setup-windows-cross
    # composite installs the mingw-w64 + Wine + Qt(win64_mingw) + qpdf
    # toolchain on the runner instead. Proven end-to-end locally:
    # trailer.exe cross-links and 26/26 unit tests pass under Wine.
    runs-on: trailer-k8s
    # Wine is slow on the low-power trailer-k8s Xeons (~2.5-3 s startup
    # per test binary; the unit suite runs ~80 s vs ~38 s native). The
    # first cold run also cross-builds qpdf/libjpeg and downloads Qt
    # (~2.6 GB) before the cache warms, so give it release-job headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-cross

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # SEPARATE key from the Linux build-and-test job: this is a
          # different compiler (mingw-w64 g++) targeting Windows, so its
          # object cache must not collide with the native gcc one.
          key: ci-windows-cross-mingw
          max-size: 500M
          # Custom trailer-runner image ships an empty apt index, so the
          # action must run `apt-get update` before `apt-get install ccache`.
          update-package-index: true

      - name: Configure
        # Same invocation as scripts/build-windows.sh (reusing the
        # repo's cmake/toolchain-mingw-w64.cmake) plus two additions the
        # k8s egress policy forces:
        #   * -DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME_PREBUILT overrides
        #     the ONNX release-asset download (403s through the proxy)
        #     with the NuGet binaries the composite assembled.
        #   * ccache launcher, matching the Linux job.
        # TRAILER_WERROR stays OFF (see workflow header).
        run: >-
          cmake -S . -B build-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw-w64.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH="$QT_WIN_DIR;$QPDF_DIR"
          -DQT_HOST_PATH="$QT_HOST_DIR"
          -Dqpdf_DIR="$QPDF_DIR/lib/cmake/qpdf"
          -DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME_PREBUILT="$ORT_WIN_DIR"
        env:
          # Pin pkg-config to the mingw sysroot so nothing picks up host
          # -dev packages and injects -isystem /usr/include (glibc
          # headers into a mingw compile). Harmless if host libs absent.
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig

      - name: Build
        run: cmake --build build-win --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"

      - name: Bundle self-contained trailer.exe
        # Reuse scripts/build-windows.sh's collect_dlls import-table
        # walk (BFS over the PE import table via objdump) rather than
        # reinventing DLL discovery. Pre-configured/built build-win/
        # already exists, so --in-container skips its configure branch,
        # runs a no-op incremental build, then copies trailer.exe +
        # every transitively-loaded DLL + platforms/qwindows.dll into
        # OUT_DIR. imageformats/ is added on top (trailer's JPEG export
        # loads qjpeg.dll at runtime; the import-table walk can't see
        # runtime-loaded plugins).
        run: |
          set -euo pipefail
          BUILD_DIR="$PWD/build-win" \
          OUT_DIR="$PWD/dist/trailer-windows-x86_64" \
          QT_DIR="$QT_WIN_DIR" \
          QT_HOST_DIR="$QT_HOST_DIR" \
          QPDF_DIR="$QPDF_DIR" \
            bash scripts/build-windows.sh --in-container
          mkdir -p dist/trailer-windows-x86_64/imageformats
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll dist/trailer-windows-x86_64/imageformats/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-windows-x86_64/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-windows-x86_64
          path: dist/trailer-windows-x86_64
          retention-days: 30

      - name: Wine unit tests
        # Mirrors the Linux job's selector but also drops the `perf` tier
        # (`--label-exclude 'uat|perf'`) so this stays a real Windows-
        # behaviour gate, not a toy: the UAT tier needs a windowed platform
        # plugin Wine's offscreen doesn't provide, and wall-time perf
        # budgets are noise under the Wine emulator — they run natively on
        # Linux (the project's no-CI-wall-time-gate perf ruling).
        # CMAKE_CROSSCOMPILING_EMULATOR is applied via an incremental
        # reconfigure (it's baked into CTestTestfile.cmake at generate
        # time) so ctest launches each .exe under wine.
        #
        # Every test .exe lands in build-win/ root, so the DLLs it loads
        # must sit right beside it — Wine's application-dir search is the
        # reliable path (WINEPATH proved flaky on the runner). The Bundle
        # step already walked trailer.exe's import table into the artifact
        # dir; copy those DLLs back next to the exes, then add the two
        # test-only extras the import walk can't see: Qt6Test.dll (only
        # the test binaries link it) and the runtime-loaded plugin dirs
        # platforms/ + imageformats/ (test_adapters' JPEG-export assertion
        # needs qjpeg.dll).
        timeout-minutes: 30
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
          DISPLAY: ''
          QT_QPA_PLATFORM: offscreen
          # Same mingw-sysroot pin as the Configure step: this
          # incremental reconfigure re-runs qpdf's pkg_check_modules, so
          # keep host -dev packages from leaking -isystem /usr/include
          # into the mingw compile here too.
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig
        run: |
          set -euo pipefail
          # One-time headless prefix init in a writable location.
          wine wineboot --init
          # Bake the wine emulator into the test commands.
          cmake -S . -B build-win -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/wine
          # Runtime DLLs (Qt6*, onnxruntime, qpdf30, mingw runtime, …)
          # collected next to trailer.exe by the Bundle step.
          cp dist/trailer-windows-x86_64/*.dll build-win/
          # Test-only additions the import-table walk misses.
          cp "$QT_WIN_DIR/bin/Qt6Test.dll" build-win/
          mkdir -p build-win/platforms build-win/imageformats
          cp "$QT_WIN_DIR"/plugins/platforms/qoffscreen.dll \
             "$QT_WIN_DIR"/plugins/platforms/qminimal.dll \
             "$QT_WIN_DIR"/plugins/platforms/qwindows.dll build-win/platforms/
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll build-win/imageformats/
          cd build-win
          ctest -C Release --label-exclude 'uat|perf' --output-on-failure

  # disabled 2026-07-09 to conserve Actions usage (2x multiplier); re-enable when needed
  build-and-test-windows:
    name: Windows build + unit tests (MSVC)
    runs-on: windows-2022
    if: false
    # Native Windows build path. Mirrors what scripts/build-windows-native.ps1
    # does locally: aqtinstall Qt + qpdf MSVC prebuilt + MSVC 2022 +
    # ninja → ctest. This catches Windows-only regressions before
    # release (the cross-build via mingw in release.yml uses a
    # different toolchain and can paper over MSVC-specific issues
    # like the QTemporaryFile-vs-qpdf write conflict).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        # Pinned to 6.10.3 because aqtinstall 3.3.0 / install-qt-action
        # don't yet handle the toolchain-suffixed directory layout Qt
        # 6.11.x uses on download.qt.io. Bump in lockstep with
        # .github/actions/setup-linux-build once aqt fixes that.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtpdf'
          cache: true

      - name: Install qpdf (MSVC prebuilt)
        # Microsoft Visual C++ prebuilt zip from the upstream qpdf
        # release page. Match the version that scripts/install-windows-
        # deps.ps1 defaults to so a green CI run matches what local
        # developers see.
        shell: pwsh
        run: |
          $qpdfVersion = '12.3.2'
          $zip = "qpdf-$qpdfVersion-msvc64.zip"
          Invoke-WebRequest "https://github.com/qpdf/qpdf/releases/download/v$qpdfVersion/$zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath . -Force
          Move-Item "qpdf-$qpdfVersion-msvc64" "$env:GITHUB_WORKSPACE/qpdf"
          # Make qpdf's bin discoverable for ctest (Qt's bin is added
          # by install-qt-action via QT_ROOT_DIR + Path edits).
          "$env:GITHUB_WORKSPACE\qpdf\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        # Ninja is the right generator on Windows too: it parallelises
        # AUTOMOC + compile better than MSBuild on a small project,
        # and the resulting CMakeCache lines up with what
        # scripts/build-windows-native.ps1 produces locally. We don't
        # use ccache here — sccache would be the Windows equivalent
        # but the cold build is fast enough (<2 min on the runner)
        # that the cache-management cost isn't worth it yet.
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$env:GITHUB_WORKSPACE/qpdf"

      - name: Build
        shell: pwsh
        # PowerShell has no `${VAR:-default}` shorthand; spell the same
        # "explicit numeric job count, falling back to 2" fallback out
        # (see the workflow-level env comment for why this can't be a
        # bare `--parallel`).
        run: |
          $jobs = if ($env:CMAKE_BUILD_PARALLEL_LEVEL) { $env:CMAKE_BUILD_PARALLEL_LEVEL } else { '2' }
          cmake --build build --config Release --parallel $jobs

      - name: Unit tests
        # QT_QPA_FONTDIR is set so QPdfWriter has access to Arial etc.
        # under the offscreen platform plugin. Without this, Qt 6 on
        # Windows draws text as filled vector paths and search-related
        # tests can't find anything in the generated PDFs. See the
        # comment in tests/uat/CMakeLists.txt.
        working-directory: build
        shell: pwsh
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts

  clang-format:
    name: clang-format (advisory)
    runs-on: trailer-small
    timeout-minutes: 5
    # Advisory only — output goes to the job summary so the diff is
    # visible without bouncing merges. Flip to required once the tree
    # is reliably formatted (post-1.0 / when a pre-commit hook lands).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        # Pinned to v14 to match scripts/run-uat.sh and the maintainer's
        # local toolchain. Available in noble universe.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - name: Run clang-format
        shell: bash
        run: |
          set +e
          OUTPUT=$(git ls-files '*.cpp' '*.h' '*.mm' \
            | xargs clang-format-14 --dry-run --Werror 2>&1)
          EXIT=$?
          if [ "$EXIT" -ne 0 ]; then
            {
              echo "## clang-format diff"
              echo ""
              echo "Files below need a re-format. Run locally:"
              echo ""
              echo '```sh'
              echo "git ls-files '*.cpp' '*.h' '*.mm' \\"
              echo "  | xargs clang-format-14 -i"
              echo '```'
              echo ""
              echo "### clang-format output"
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::clang-format reported issues — see job summary"
          else
            echo "clang-format: clean ✓"
          fi
