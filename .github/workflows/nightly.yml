# Nightly release pipeline — full-test, partial-success builds published on
# a schedule.
#
# Unlike dev-build.yml (unsigned, on-demand, uploaded to the RUN, tests
# non-blocking) and release.yml (tagged, human-triggered, UAT gates the
# per-OS build matrix as ONE combined signal), Nightly:
#   - fires on a timer, unattended;
#   - runs the FULL test suite (unit + UAT, `ctest -L uat`) PER OS, not once
#     centrally — Linux native, Windows via the existing Wine cross-build
#     workers, macOS on the owner's self-hosted Apple Silicon runner;
#   - ships PARTIAL-SUCCESS releases: any OS lane that builds and passes its
#     GATING checks gets its artifact published, even if the other two
#     lanes are red. A lane's "Stage + upload" step is always its LAST step,
#     so an artifact only exists to publish if every step above it that can
#     fail the job (no `continue-on-error`) succeeded — partial-success
#     semantics fall out of ordinary step `if: success()` with no extra
#     pass/fail plumbing. TWO deliberate exceptions: Windows' "UAT suite
#     (Wine)" step carries `continue-on-error: true` (owner decision,
#     2026-07-24) — Wine UAT is informational, not gating, until a real
#     Windows CI runner exists; see that step's comment and
#     docs/backlog/2026-07-24-wine-uat-failures-triage.md. macOS's "UAT
#     suite" step carries the same `continue-on-error: true` (owner
#     decision, 2026-07-26) — the mac lane is brand new (PR #120/#121,
#     2026-07-24) and its UAT has never once passed, so gating on it would
#     withhold an otherwise-green macOS build indefinitely; see that step's
#     comment and docs/backlog/2026-07-26-macos-uat-triage.md. Both lanes'
#     real pass counts still surface, non-silently, in the release body's
#     status table (never just dropped);
#   - tags each successful night `nightly-YYYYMMDD` (immutable, one per
#     night — never a rolling/force-moved tag) and carries a semi-automated
#     "since last nightly" summary (scripts/release-notes.sh over the
#     previous nightly-* tag..HEAD) in the release body, alongside a
#     per-OS ✅/❌ status table so a partial release is honest about what
#     didn't make it in;
#   - is a pure SIGNAL channel, not a merge/release gate: it never touches
#     VERSION, never tags/publishes a v* release, and release.yml /
#     release-publish.yml / release-autotag.yml are untouched by this file.
#
# macOS availability: the self-hosted runner (runs-on: [self-hosted, macOS,
# ARM64], same labels dev-build.yml's dev-macos job proved out in #120) is a
# single-instance VM on the owner's laptop and may be offline for hours (see
# the schedule comment below — a stuck mac lane is exactly why "results
# ready by morning" is an expectation, not a guarantee). That's fine —
# nightly-publish `needs` all three lanes with `if: always()`, so it simply
# waits for macOS to reach a terminal state (success, or GitHub's own ~24h
# "no runner available" auto-fail of a queued job) before assembling the
# release from whichever lanes are green.
#
# Concurrency: the nightly-date job (below) resolves today's UTC date and a
# concurrency key ONCE, before any lane starts or waits on anything — so a
# slow mac-VM wait that straddles midnight can't smear the tag, or the
# concurrency scope, into the wrong day. Every lane job and nightly-publish
# carries a job-level `concurrency:` keyed off that value: dry runs each get
# a unique key (never contend with anything), while REAL runs (the
# schedule, or an explicit dry_run:false dispatch) on the SAME UTC day
# share one key per lane — so a stray manual real dispatch can't double-
# book the single-instance mac runner or double-publish alongside that
# day's scheduled run. A DIFFERENT day always gets a different key, so one
# stuck night's mac wait can NEVER block the next (independent) night's
# Linux/Windows results — a workflow- or day-spanning lock would defeat the
# whole point of the partial-success design. Idempotent tag/release
# creation (skip if today's tag already exists — mirroring
# release-autotag.yml) is the remaining guard for anything outside that
# same-day-same-mode grouping (see the "Create tag" step's comment on the
# residual TOCTOU there).
#
# k8s pool sharing: nightly-linux and nightly-windows both run on the
# shared trailer-k8s pool (also used by ci.yml/release.yml). They are
# SERIALIZED, not parallel — nightly-windows `needs: [nightly-date,
# nightly-linux]` + `if: always() && needs.nightly-date.result ==
# 'success'`, so it starts only once Linux's job has finished (success or
# failure never gates it, only completion-timing does). This was added
# after bootstrap run 30099999309 (2026-07-24) fired nightly.yml
# simultaneously with a routine ci.yml PR-validate run, putting FOUR heavy
# compile jobs on the pool at once; pods were evicted mid-Build on both
# lanes and the pool stalled for ~90 minutes. Nightly carries no latency
# requirement, so trading parallelism for peak-footprint safety here is
# free. The self-hosted macOS lane is unaffected — different runner
# entirely — and stays fully parallel.
#
# Failure surfacing: nightly-publish's LAST-but-one step fails the job (and
# so the whole workflow run) whenever any lane's result isn't `success` —
# even though the release itself, if any lane went green, was already
# published by an earlier step in the same job. A red run is what makes
# GitHub's built-in "scheduled workflow failed" notification fire for repo
# watchers, with no extra issues:write permission or dedup logic needed.
#
# The UAT ratchet (added after nightly-20260729 shipped all-green with a
# macOS UAT crash and Wine at 21/40 — continue-on-error on those two lanes'
# UAT steps means a bad-but-non-crashing job `result` is `success`, so the
# per-lane check above stayed silent): a SEPARATE, final step reds the run
# when Wine UAT or macOS UAT is WORSE than the immediately PREVIOUS
# nightly's, closing the gap without restoring the gate — the release still
# publishes exactly as it does today in every case; only the run's signal
# changes. Mechanism:
#   - Baseline source: a small `uat-summary.json` asset attached to every
#     REAL nightly release ("Build release body" writes it, "Create tag +
#     GitHub Release" publishes it alongside the binaries). Chosen over a
#     committed docs/uat-baselines.json (would need this job to push a
#     commit to main on every run — more privilege, more risk, and
#     unrelated-to-source noise in git history) and over an Actions cache
#     (best-effort/evictable, not human-inspectable, not versioned with
#     what actually shipped that night). A release asset is atomic with the
#     artifacts it describes and trivially fetched by tag.
#   - "Worse" axis (scripts/compare-uat-baseline.sh — a standalone,
#     directly-executable script whose fixture matrix is committed as
#     scripts/test-compare-uat-baseline.sh and runs in ci.yml; see its
#     header comment for the full rationale): crash state is checked first
#     and dominates — a newly-crashing lane is always worse regardless of
#     counts, a newly-clean lane always better. When crash state is
#     unchanged, the ABSOLUTE PASSED COUNT is compared: fewer tests
#     passing than last night is worse, more is better, equal is
#     unchanged. The suite TOTAL is reported beside the verdict as a note
#     ("+1 test added") but never affects it.
#     This replaced a pass-RATIO comparison on 2026-08-02. The ratio axis
#     reds a run as REGRESSED when a FAILING TEST IS ADDED and nothing
#     actually regressed — which is precisely this repo's documented
#     workflow (AGENTS.md "CI cadence": every confirmed defect lands as a
#     regression guard, written red, before the fix). It produced a false
#     REGRESSED on nightly-20260801's macOS lane (40/41 → 40/42, pass
#     count flat). Absolute-count comparison has a narrower residual
#     blind spot — a regression masked by a new passing test the same
#     night — tracked in
#     docs/backlog/2026-08-02-uat-ratchet-per-test-identity.md.
#   - Degrade gracefully, always: no previous release, no asset on it, an
#     asset that fails to parse, or a previous night where the lane itself
#     wasn't green — all collapse to `no_baseline`, which is never `worse`.
#     This is what makes the very first ratcheted run print green with no
#     separate "first run" special case: yesterday's pre-ratchet release
#     simply has no asset to download.
#   - Ratchets forward automatically: THIS run's own counts are written to
#     the summary regardless of verdict, becoming tomorrow's baseline — an
#     improved night raises the floor. Comparison is against the single
#     immediately-previous nightly (a sliding window), not a historical
#     high-water mark, so a long-standing, already-triaged bad count (e.g.
#     Wine's steady ~21/40) reads as `same` and stays green night after
#     night instead of alarming forever for a known, already-backlogged
#     issue — the same reasoning that made these two lanes non-gating in
#     the first place.
#   - A lane going from present to ABSENT (job cancelled, mac VM offline,
#     etc.) is UNCHANGED behaviour: the pre-existing "any lane result !=
#     success" check below already reds the run for that (see e.g. the
#     2026-07-28 mac-lane cancellation) — the ratchet's own comparison
#     short-circuits to `not_applicable` in that case and adds nothing
#     (and nothing conflicting).
#   - The release body's per-OS table states the comparison outcome in
#     words (e.g. "unchanged vs nightly-20260728", "REGRESSED from 40/40")
#     alongside the existing ✅/⚠️/🔥 count — the release stays the human-
#     readable record, per G2's spirit.
#
# Retention: nightly-* releases (assets) older than ~6 months are deleted by
# a cleanup step in nightly-publish (`gh release delete`, no `--cleanup-tag`
# — the git tag itself is NEVER deleted, so `nightly-YYYYMMDD..HEAD` diffing
# and bisecting stay possible indefinitely; only the multi-hundred-MB binary
# assets age out).
#
# Skip-when-unchanged (scripts/resolve-nightly-skip.sh): nightly-date
# resolves a SKIP decision immediately after computing the date/tag/
# concurrency-key above — before any lane starts, so a no-op night never
# spends runner time (especially the single-instance mac VM). The
# comparison is CODE, not commit count: `git diff --quiet` between the
# resolved build commit and the commit the PREVIOUS nightly-* tag points
# at, not a commit-count heuristic (see nightly-20260729, which "rebuilt"
# on a range release-notes.sh itself reported as "0 non-merge commits" —
# counting commits is exactly the wrong signal; see the script's header for
# the full rationale, including why docs-only changes are deliberately NOT
# skipped). Baseline source is the previous nightly TAG's target commit —
# chosen over parsing the release body or adding a field to
# uat-summary.json because it needs no new schema and is definitionally
# correct: nightly-publish's "Create tag + GitHub Release" step tags the
# EXACT commit that was built, so the tag *is* the provenance record,
# already being written, for free. Degrades to BUILD (never skip) on any
# missing/unresolvable signal — see the script's header. workflow_dispatch
# carries its own `force` input (independent of `dry_run`) so a human
# asking for a nightly always gets one, bypassing the skip check entirely;
# the schedule trigger always defers to the check.
#
# Observability on a skip night (no lie-by-omission): every lane job's `if`
# also requires `needs.nightly-date.outputs.skip != 'true'`, so all three
# report `skipped` (not `failure`) and the existing "fail the run if any
# lane didn't fully pass" step is additionally guarded on `skip != 'true'`
# so a skipped-not-successful lane can't red the run. nightly-publish still
# runs (`if: always()` — unchanged) and, on a skip night, does ONLY one
# thing: write a step-summary + `::notice::` line naming the reason and the
# matched commit. It does not cut a release, attach assets, or run
# retention cleanup — every other step in that job gets the same
# `skip != 'true'` guard added to its existing `if:`.
#
# UAT ratchet safety on a skip night (the subtle part): nightly-publish's
# "Find previous nightly tag" step ALREADY walks back to the most recent
# EXISTING `nightly-*` tag via `git tag -l 'nightly-*' | sort -r | head -1`
# — it has no assumption that the previous tag is "yesterday's". Because a
# skip night creates NO tag and NO release, that lookup transparently skips
# over the gap on the next REAL night and finds the last night that
# actually published — so the ratchet's baseline is never a hole and never
# silently degrades to `no_baseline` just because a night in between was
# skipped. This falls out of the existing lookup with no code change; it
# only holds because skip nights are deliberately tagless — if a skip night
# ever grows a placeholder tag/release, this reasoning would need
# revisiting.
#
# Testing this file: workflow_dispatch defaults `dry_run` to true, which
# runs every build/test lane exactly as normal but skips the tag, the
# GitHub Release, and the retention cleanup in nightly-publish — it prints
# what WOULD have been published to the step summary instead. This lets a
# manual proof run validate the full pipeline (including a real,
# hours-long wait for the mac VM) without creating a real nightly-YYYYMMDD
# tag. Pass dry_run=false on a manual dispatch to cut a real nightly on
# demand instead of waiting for the 10:00 UTC schedule.

name: Nightly

on:
  schedule:
    # 10:00 UTC daily (~03:00 America/Los_Angeles / ~06:00 America/New_York)
    # — lands after a typical US workday, results USUALLY ready the next
    # morning. "Usually": an offline mac VM can delay the macOS artifact/
    # status by hours (see the header) — Linux/Windows still land close to
    # the schedule time regardless, since a stuck mac lane never blocks them.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: git ref/branch/SHA to build (defaults to the triggering ref)
        required: false
        type: string
        default: ''
      dry_run:
        description: >-
          Skip tag + GitHub Release creation and the retention cleanup, so a
          manual test run never touches the nightly-YYYYMMDD tag chain.
          Build/unit/UAT lanes still run exactly as normal. Set false to cut
          a real nightly on demand.
        required: false
        type: boolean
        default: true
      force:
        description: >-
          Build tonight even if main hasn't changed since the previous
          nightly (bypasses the skip-when-unchanged check in nightly-date).
          A human explicitly dispatching this workflow always gets a build
          regardless of this flag's value combined with dry_run — this only
          controls whether an UNCHANGED tree still builds. Ignored for the
          schedule trigger, which always defers to the skip check.
        required: false
        type: boolean
        default: false

# Least privilege at the top; nightly-publish elevates to contents: write
# for itself only (tag push + release creation), matching release-
# publish.yml's pattern.
permissions:
  contents: read

jobs:
  nightly-date:
    name: Resolve nightly date + run mode
    runs-on: trailer-small
    # Was 2 when this job was pure shell (no checkout). Now does a
    # fetch-depth:0 checkout (needed for the skip-when-unchanged diff below)
    # — mirroring nightly-publish's identical checkout, which budgets 15 on
    # the same trailer-small runner. 5 gives headroom without hiding a
    # genuinely stuck checkout for minutes on end.
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
      concurrency-key: ${{ steps.resolve.outputs.concurrency-key }}
      skip: ${{ steps.skip.outputs.skip }}
      skip-reason: ${{ steps.skip.outputs.skip-reason }}
      current-commit: ${{ steps.skip.outputs.current-commit }}
      prev-nightly-tag: ${{ steps.skip.outputs.prev-nightly-tag }}
      matched-commit: ${{ steps.skip.outputs.matched-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the skip decision below diffs against the
          # previous nightly-* tag's target commit, and needs that commit
          # (and every tag) present locally.
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - id: resolve
        # Captured ONCE, here, before any lane starts or waits on the mac
        # VM. Previously nightly-publish computed TAG itself after
        # `needs:`-waiting on all three lanes — a mac-VM wait that
        # straddled the UTC day boundary would tag with the COMPLETION
        # date, not the trigger date, and could silently collide with the
        # next scheduled run's tag-exists check. Every downstream job
        # reads this job's outputs instead of recomputing `date -u` late.
        #
        # DRY-RUN INVARIANT (default-closed, permanent — not just for
        # bootstrapping): real (tag/release-creating) mode requires
        # (event == schedule) OR (event == workflow_dispatch AND the
        # dry_run input is explicitly false). Every other event is FORCED
        # dry-run, with no enumeration of "safe" events to keep in sync.
        # This is deliberately the inverse of "dry-run only when asked" —
        # it means any trigger this workflow doesn't currently declare
        # (e.g. the temporary bootstrap `push:` trigger used to register
        # this workflow with GitHub pre-merge, since removed) is safe by
        # construction if it's ever added back: it can never create a
        # tag/release/delete a retained one, because it can never satisfy
        # either REAL branch
        # below.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY_RUN=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            DRY_RUN=false
          else
            DRY_RUN=true
          fi
          DATE="$(date -u +%Y%m%d)"
          TAG="nightly-$DATE"
          if [ "$DRY_RUN" = "true" ]; then
            # Dry runs never contend with anything — each gets a unique
            # key so concurrent test dispatches don't queue behind each
            # other or behind a real run.
            KEY="dryrun-${{ github.run_id }}"
          else
            # All REAL runs (the schedule, or an explicit dry_run:false
            # dispatch) on the SAME UTC calendar day share one key, so a
            # stray manual dispatch can't double-book the single-instance
            # mac runner (or double-publish) alongside that day's
            # scheduled run. A DIFFERENT day gets a DIFFERENT key, so a
            # long mac-VM wait never blocks the next day's run — see the
            # workflow header.
            KEY="real-$DATE"
          fi
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "dry-run=$DRY_RUN"    >> "$GITHUB_OUTPUT"
          echo "concurrency-key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG dry-run=$DRY_RUN concurrency-key=$KEY"

      - id: skip
        # Skip-when-unchanged (scripts/resolve-nightly-skip.sh — see the
        # workflow header's "Skip-when-unchanged" section for the full
        # rationale). Runs BEFORE any lane job starts, so a no-op night
        # never spends runner time. Every downstream job/step that needs
        # the verdict reads this job's `skip`/`skip-reason`/`matched-commit`
        # outputs rather than recomputing it.
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE=true
          else
            FORCE=false
          fi

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          # Same lookup nightly-publish's "Find previous nightly tag" step
          # uses (tag names sort lexicographically by date) — kept
          # independent rather than shared as an output, since nightly-
          # publish needs the tag name again later regardless (for the
          # since-last-nightly changelog) after `needs:`-waiting on the
          # lanes, by which point today's tag may already exist.
          PREV_TAG="$(git tag -l 'nightly-*' | sort -r | head -1)"
          PREV_COMMIT=""
          if [ -n "$PREV_TAG" ]; then
            PREV_COMMIT="$(git rev-list -n1 "refs/tags/$PREV_TAG" 2>/dev/null || true)"
          fi

          eval "$(bash scripts/resolve-nightly-skip.sh "$FORCE" "$CURRENT_COMMIT" "$PREV_TAG" "$PREV_COMMIT")"

          echo "skip=$SKIP"                    >> "$GITHUB_OUTPUT"
          echo "skip-reason=$REASON_CODE"      >> "$GITHUB_OUTPUT"
          echo "current-commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "prev-nightly-tag=$PREV_TAG"    >> "$GITHUB_OUTPUT"
          echo "matched-commit=$MATCHED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Skip decision: skip=$SKIP reason=$REASON_CODE current=$CURRENT_COMMIT prev_tag=${PREV_TAG:-<none>} prev_commit=${PREV_COMMIT:-<none>} matched=${MATCHED_COMMIT:-<none>}"

          if [ "$SKIP" = "true" ]; then
            {
              echo "## Nightly skipped — no code changes"
              echo
              echo "\`$CURRENT_COMMIT\` matches the tree $PREV_TAG (\`$MATCHED_COMMIT\`) was built from — nothing changed since the previous nightly, so all three build lanes and the release step are skipped this run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  nightly-linux:
    name: Linux full lane (build + unit + UAT)
    needs: [nightly-date]
    # Skipped whenever nightly-date found no code change since the previous
    # nightly (see the workflow header's "Skip-when-unchanged" section) —
    # this is the runner-time win the skip check exists for.
    if: needs.nightly-date.outputs.skip != 'true'
    runs-on: trailer-k8s
    timeout-minutes: 60
    concurrency:
      # Same-UTC-day REAL runs (scheduled + any manual dry_run:false
      # dispatch) serialize against each other, lane by lane; dry runs and
      # different days never contend — see nightly-date's step comment.
      group: nightly-lane-linux-${{ needs.nightly-date.outputs.concurrency-key }}
      cancel-in-progress: false
    env:
      # k8s-OOM guard (see ci.yml's env comment for the underlying
      # CMAKE_BUILD_PARALLEL_LEVEL bug). REASSESSED (2026-07-26):
      # CMAKE_BUILD_PARALLEL_LEVEL raised from 1 back to 2 — the -j1 was
      # chased against the 2026-07-24 mid-Build kills, but this job's
      # `cmake --build … --parallel` (below) was bare, so that env var
      # was never actually enforced (bare `--parallel` ignores it
      # entirely); the kills happened under fully unbounded parallelism
      # regardless of the value set here. Now that the step passes the
      # job count explicitly, 2 matches every other lane in the repo
      # (ci.yml, release.yml, nightly-windows) and is the reasonable
      # starting point — see the fix PR for the full history. This does
      # NOT extend to CTEST_PARALLEL_LEVEL below: ctest has no such bug
      # (it reads its env var normally regardless of command-line flags),
      # so the existing 1 there was a real, working cap and is left
      # unchanged by this fix.
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the app's About-box version string is git-derived
          # (commit count + short SHA) at CMake configure time.
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Share release.yml's linux-build cache prefix for warm hits —
          # nightly builds the identical recipe plus tests.
          key: release-${{ runner.os }}-gcc-linux
          max-size: 500M
          update-package-index: true

      - name: Configure
        # Mirrors release.yml's linux-build exactly (no UX-recorder flag —
        # nightly represents "what would ship", like release, not the dev
        # opt-in toggles). TRAILER_WERROR stays OFF (Qt/libstdc++/qpdf
        # system-header noise; see release.yml's header).
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"

      - name: Unit tests
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

      - name: UAT suite
        # Native Linux needs no Docker layer to run this offscreen — the
        # setup-linux-build action already installs everything ctest -L uat
        # needs (the same base ci.yml's wayland-smoke job builds on), so
        # nightly runs UAT in-job rather than reusing release.yml's
        # separate Docker-based `uat` job.
        working-directory: build
        run: ctest -C Release --output-on-failure -L uat
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Stage Linux artifact
        # Reached only if build + both test steps above succeeded — that
        # ordering IS the partial-success gate, no extra bookkeeping.
        run: |
          set -euo pipefail
          mkdir -p dist/trailer-linux-x86_64
          cp build/trailer dist/trailer-linux-x86_64/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-linux-x86_64/
          cp -r licenses/third-party dist/trailer-linux-x86_64/
          (cd dist && tar -czf nightly-trailer-linux-x86_64.tar.gz trailer-linux-x86_64)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-trailer-linux-x86_64
          path: dist/nightly-trailer-linux-x86_64.tar.gz
          # Short-lived: nightly-publish promotes this into the GitHub
          # Release within the same run, which is the long-term store.
          # This copy only exists to debug/recover a failed publish job.
          retention-days: 7

  nightly-windows:
    name: Windows full lane (Wine cross-build + unit + UAT)
    # Serialized AFTER nightly-linux (see `needs`/`if` below), not parallel
    # to it. Both share the same trailer-k8s pool; bootstrap run 30099999309
    # (2026-07-24) fired nightly.yml and ci.yml simultaneously, putting two
    # full heavy-compile lanes on the pool at once — pods got evicted mid-
    # Build and the pool stalled ~90 min. `needs: [nightly-date,
    # nightly-linux]` orders Windows to start only once Linux's job has
    # finished (success OR failure — `if: always()` below), halving nightly's
    # peak k8s footprint without making a Linux failure skip Windows. The
    # mac lane stays fully parallel (different runner entirely). Nightly has
    # no latency requirement, so the added wall-clock is a non-issue.
    needs: [nightly-date, nightly-linux]
    # `always()` so a red Linux lane still lets Windows run (unchanged);
    # `skip != 'true'` is the new guard — see nightly-linux's comment above.
    if: always() && needs.nightly-date.result == 'success' && needs.nightly-date.outputs.skip != 'true'
    runs-on: trailer-k8s
    # release.yml's windows-cross (build + bundle + unit tests only) budgets
    # 60. UAT adds a second full pass of Wine-emulated test binaries
    # (~2.5-3s startup each under Wine per ci.yml's own note) on top, so
    # this gets real headroom rather than a tight squeeze.
    timeout-minutes: 120
    concurrency:
      group: nightly-lane-windows-${{ needs.nightly-date.outputs.concurrency-key }}
      cancel-in-progress: false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
    outputs:
      # Wine UAT is non-gating (see the step below) so its outcome doesn't
      # show up in this job's own `result` — surfaced explicitly here
      # instead, for nightly-publish's release-body status table.
      wine-uat-passed: ${{ steps.wine_uat.outputs.passed }}
      wine-uat-total: ${{ steps.wine_uat.outputs.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-windows-cross

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: release-windows-cross-mingw
          max-size: 500M
          update-package-index: true

      - name: Configure
        # Identical invocation to release.yml's windows-cross Configure.
        run: >-
          cmake -S . -B build-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw-w64.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH="$QT_WIN_DIR;$QPDF_DIR"
          -DQT_HOST_PATH="$QT_HOST_DIR"
          -Dqpdf_DIR="$QPDF_DIR/lib/cmake/qpdf"
          -DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME_PREBUILT="$ORT_WIN_DIR"
        env:
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig

      - name: Build
        run: cmake --build build-win --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-2}"

      - name: Bundle self-contained trailer.exe
        # Same import-table DLL walk release.yml's windows-cross uses.
        run: |
          set -euo pipefail
          BUILD_DIR="$PWD/build-win" \
          OUT_DIR="$PWD/dist/trailer-windows-x86_64" \
          QT_DIR="$QT_WIN_DIR" \
          QT_HOST_DIR="$QT_HOST_DIR" \
          QPDF_DIR="$QPDF_DIR" \
            bash scripts/build-windows.sh --in-container
          mkdir -p dist/trailer-windows-x86_64/imageformats
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll dist/trailer-windows-x86_64/imageformats/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-windows-x86_64/
          cp -r licenses/third-party dist/trailer-windows-x86_64/

      - name: Prep Wine test environment
        # Shared setup for both test steps below: wine's headless prefix
        # init, the emulator hookup, and the DLLs/plugins every test .exe
        # needs sitting beside it. Split out of the (single, combined)
        # step release.yml/ci.yml use, since nightly runs unit and UAT as
        # two distinctly-reported steps.
        run: |
          set -euo pipefail
          wine wineboot --init
          cmake -S . -B build-win -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/wine
          cp dist/trailer-windows-x86_64/*.dll build-win/
          cp "$QT_WIN_DIR/bin/Qt6Test.dll" build-win/
          mkdir -p build-win/platforms build-win/imageformats
          cp "$QT_WIN_DIR"/plugins/platforms/qoffscreen.dll \
             "$QT_WIN_DIR"/plugins/platforms/qminimal.dll \
             "$QT_WIN_DIR"/plugins/platforms/qwindows.dll build-win/platforms/
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll build-win/imageformats/
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig

      - name: Unit tests (Wine)
        # Same selector as ci.yml/release.yml's Wine job: `perf` stays
        # excluded (wall-time budgets are noise under emulation), `uat`
        # does NOT — this is the one addition nightly makes over CI/release.
        working-directory: build-win
        timeout-minutes: 30
        run: ctest -C Release --label-exclude 'uat|perf' --output-on-failure
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
          DISPLAY: ''
          QT_QPA_PLATFORM: offscreen

      - name: UAT suite (Wine)
        # New: CI/release exclude `uat` on the Wine lane entirely. The UAT
        # harness forces QT_QPA_PLATFORM=offscreen unconditionally per-test
        # (tests/uat/CMakeLists.txt) — it does not actually need a windowed
        # plugin — and scripts/build-windows-native.ps1 (the disabled MSVC
        # job's script) already runs `ctest -L uat` as a matter of course,
        # so running it under Wine too is a reasonable extension, not a
        # fight with a known hard blocker.
        #
        # NON-GATING (owner decision, 2026-07-24): bootstrap run 30104846942
        # found Wine unit tests fully green (57/57) but Wine UAT at 23/40 —
        # tracked in docs/backlog/2026-07-24-wine-uat-failures-triage.md,
        # not fixed here. Wine is a stand-in for Windows, not the platform
        # Trailer ships to, so a UAT regression under Wine emulation
        # specifically must not block a build+unit-green Windows artifact
        # from publishing — this becomes a gating step again once a real
        # Windows CI runner exists. `continue-on-error: true` masks this
        # step's CONCLUSION to success (so the job's own `result`, and the
        # `if: success()`-gated staging steps below, are unaffected by a
        # Wine UAT failure), while the script still captures the REAL
        # pass/total counts as step outputs (surfaced job-wide via
        # `outputs:` above) so the count stays visible — informational,
        # never silent — in nightly-publish's release-body status table.
        id: wine_uat
        continue-on-error: true
        working-directory: build-win
        timeout-minutes: 30
        run: |
          set +e
          ctest -C Release -L uat --output-on-failure | tee /tmp/wine-uat.log
          # Shared with nightly-macos' "UAT suite" step — see
          # scripts/parse-ctest-uat-summary.sh for why this isn't a plain
          # "[0-9]+ tests failed" grep (that silently misreports a full
          # pass as "count unavailable" the day this item's own goal — a
          # clean Wine UAT run — is reached; fixed 2026-07-26, see
          # docs/backlog/2026-07-24-wine-uat-failures-triage.md).
          eval "$(bash "$GITHUB_WORKSPACE/scripts/parse-ctest-uat-summary.sh" /tmp/wine-uat.log)"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "Wine UAT: ${PASSED:-unknown}/${TOTAL:-unknown} passed (non-gating)"
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
          DISPLAY: ''
          QT_QPA_PLATFORM: offscreen

      - name: Stage Windows artifact
        run: |
          set -euo pipefail
          (cd dist/trailer-windows-x86_64 && 7z a -tzip ../nightly-trailer-windows-x86_64.zip .)

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-trailer-windows-x86_64
          path: dist/nightly-trailer-windows-x86_64.zip
          retention-days: 7

  nightly-macos:
    name: macOS full lane (build + unit + UAT, self-hosted)
    needs: [nightly-date]
    # Single-instance VM on the owner's laptop; may be offline for hours —
    # see the workflow header. nightly-publish waits for this job via
    # `needs:` + `if: always()` rather than racing it.
    # Skipped whenever nightly-date found no code change — see nightly-
    # linux's comment above. This is the runner-time win that matters most:
    # the mac lane is a single-instance self-hosted VM that would otherwise
    # burn hours rebuilding a tree it already built last night.
    if: needs.nightly-date.outputs.skip != 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    concurrency:
      group: nightly-lane-macos-${{ needs.nightly-date.outputs.concurrency-key }}
      cancel-in-progress: false
    outputs:
      # macOS UAT is non-gating (see the step below) so its outcome doesn't
      # show up in this job's own `result` — surfaced explicitly here
      # instead, for nightly-publish's release-body status table.
      macos-uat-passed: ${{ steps.macos_uat.outputs.passed }}
      macos-uat-total: ${{ steps.macos_uat.outputs.total }}
      macos-uat-crashed: ${{ steps.macos_uat.outputs.crashed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Add Homebrew to PATH
        # Same fix PR #120 landed for dev-build.yml's dev-macos job: the
        # actions-runner service process doesn't inherit the interactive
        # shell's PATH, so brew/cmake/ninja are invisible without this.
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        # Same pin as release.yml's macos-build / dev-build.yml's dev-macos.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          modules: 'qtpdf'
          cache: true

      - name: Install build deps
        run: brew install ninja

      - name: Build, bundle, and package
        # scripts/build-macos.sh builds the WHOLE tree (enable_testing() +
        # add_subdirectory(tests) in CMakeLists.txt is unconditional), so
        # the unit + UAT binaries below need no separate configure/build —
        # this step already produced them alongside Trailer.app.
        run: scripts/build-macos.sh

      - name: Unit tests
        # macOS has never run any test suite in CI before this (build-
        # macos.sh only builds/bundles/packages; `make test` on macOS is
        # an alias for the same script). This is net-new coverage.
        working-directory: build-macos
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

      - name: UAT suite
        # NON-GATING (owner decision, 2026-07-26): this is the first time
        # macOS UAT has ever run in this project (the mac lane itself only
        # landed 2026-07-24 via PR #120/#121, and unit tests only started
        # passing 2026-07-26 via PR #122/#123) — it has never once passed.
        # Gating an otherwise-green macOS build on a suite that has never
        # passed would withhold that build indefinitely, exactly the
        # failure mode already ruled out for Wine UAT (2026-07-24, see
        # nightly-windows' "UAT suite (Wine)" step and docs/backlog/2026-
        # 07-24-wine-uat-failures-triage.md). Mirrors that step's mechanism
        # exactly: `continue-on-error: true` masks this step's CONCLUSION
        # to success (so the job's own `result` — and the `if:
        # success()`-gated staging steps below — are unaffected by a macOS
        # UAT failure), while the real pass/total counts are still
        # captured and surfaced, non-silently, via job outputs into
        # nightly-publish's release-body status table. A crash (e.g. the
        # SegFault the bootstrap run for this triage found in
        # test_uat_foundations) is categorically more serious than an
        # ordinary assertion failure — ctest still emits a clean "N tests
        # passed... out of M" summary line for a crashed run (it marks the
        # crashing test FAILED and moves on), so the count alone would
        # under-communicate it; the log is grepped separately for a crash
        # signature and surfaced as its own flag rather than folded
        # silently into the N/M count. Tracked in docs/backlog/2026-07-26-
        # macos-uat-triage.md — which has full billing on the crash found
        # by the bootstrap run for this change; becomes gating again once
        # that item closes with the suite green.
        id: macos_uat
        continue-on-error: true
        working-directory: build-macos
        run: |
          set +e
          ctest -C Release --output-on-failure -L uat | tee /tmp/macos-uat.log
          # Shared with nightly-windows' "UAT suite (Wine)" step — see
          # scripts/parse-ctest-uat-summary.sh for the parsing rationale
          # (ctest omits the "F tests failed" clause when F=0, which a
          # naive grep would misread as "count unavailable" on a clean
          # pass — found while writing this step, fixed there for both
          # lanes rather than duplicating a parser that can drift).
          eval "$(bash "$GITHUB_WORKSPACE/scripts/parse-ctest-uat-summary.sh" /tmp/macos-uat.log)"
          # A crash reads very differently from "some assertions failed" —
          # surface it as its own signal. ctest's own exception label
          # ("***Exception: SegFault") and the QtTest crash handler's
          # "Received signal N (SIGxxx)" line both show up in the log even
          # when a clean N/M summary line is ALSO present (ctest treats the
          # crashing test as one more FAILED test and keeps going).
          if grep -qE '\*\*\*Exception: SegFault|Received signal [0-9]+ \(SIG[A-Z]+\)' /tmp/macos-uat.log; then
            CRASHED=true
          else
            CRASHED=false
          fi
          echo "passed=$PASSED"   >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"     >> "$GITHUB_OUTPUT"
          echo "crashed=$CRASHED" >> "$GITHUB_OUTPUT"
          echo "macOS UAT: ${PASSED:-unknown}/${TOTAL:-unknown} passed, crashed=$CRASHED (non-gating)"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Stage macOS artifact
        # scripts/build-macos.sh always names its DMG dist/trailer-macos-
        # arm64.dmg (no nightly-specific name). The other two lanes stage
        # into a nightly-trailer-*-named file BEFORE upload; this lane
        # previously uploaded the raw build-script filename directly,
        # which didn't match nightly-publish's rename-map key
        # (nightly-trailer-macos-arm64.dmg) — the artifact would download
        # fine but silently fail to rename/count, while the unprefixed
        # dist/trailer-macos-arm64.dmg still matched that step's
        # `dist/trailer-*.*` glob and got published under the SAME
        # filename every night. Staging here, mirroring the other two
        # lanes exactly, is the fix.
        run: |
          set -euo pipefail
          mv dist/trailer-macos-arm64.dmg dist/nightly-trailer-macos-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-trailer-macos-arm64
          path: dist/nightly-trailer-macos-arm64.dmg
          retention-days: 7

  nightly-publish:
    name: Assemble + publish nightly release
    needs: [nightly-date, nightly-linux, nightly-windows, nightly-macos]
    # Always run regardless of any lane's outcome — this is what lets a
    # red macOS lane (or an offline-VM timeout) NOT block the Linux/
    # Windows artifacts from shipping.
    if: always()
    runs-on: trailer-small
    timeout-minutes: 15
    concurrency:
      group: nightly-publish-${{ needs.nightly-date.outputs.concurrency-key }}
      cancel-in-progress: false
    permissions:
      # Needed to push the nightly-YYYYMMDD tag and create/update the
      # GitHub Release + delete aged-out ones during retention cleanup.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: previous nightly-* tags drive both the
          # since-last-nightly summary and the idempotency/retention checks.
          fetch-depth: 0

      - name: Skip summary (no code changes since previous nightly)
        # The observable, non-failing half of a skip night (see the
        # workflow header's "Skip-when-unchanged" section): nightly-date
        # already wrote the same summary line to ITS job summary the
        # moment the decision was made, before any lane started — this
        # mirrors it into nightly-publish's summary too, since that's the
        # job a human checking "did tonight publish?" looks at, and prints
        # an `::notice::` so it's visible from the Actions run list without
        # opening the job. No release, no assets, no retention cleanup run
        # — every step below this one is additionally guarded on
        # `needs.nightly-date.outputs.skip != 'true'`.
        if: needs.nightly-date.outputs.skip == 'true'
        run: |
          {
            echo "## Nightly skipped — no code changes"
            echo
            echo "\`${{ needs.nightly-date.outputs.current-commit }}\` matches the tree \`${{ needs.nightly-date.outputs.prev-nightly-tag }}\` (\`${{ needs.nightly-date.outputs.matched-commit }}\`) was built from — nothing changed since the previous nightly."
            echo
            echo "No release cut, no artifacts attached, retention cleanup not run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Nightly skipped — matches ${{ needs.nightly-date.outputs.prev-nightly-tag }} (commit ${{ needs.nightly-date.outputs.matched-commit }}, reason ${{ needs.nightly-date.outputs.skip-reason }})"

      - name: Find previous nightly tag
        id: prev
        if: needs.nightly-date.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Tag names sort lexicographically by date (nightly-YYYYMMDD), so
          # a plain sort avoids depending on annotated-tag creatordate
          # metadata. Excludes today's tag implicitly — it doesn't exist
          # yet at this point in the job.
          PREV=$(git tag -l 'nightly-*' | sort -r | head -1)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ]; then
            echo "Previous nightly tag: $PREV"
          else
            echo "No previous nightly tag found — this is the first nightly."
          fi

      - name: Fetch previous nightly's UAT summary
        # The ratchet's baseline (see the workflow header). Downloads the
        # PREVIOUS nightly release's uat-summary.json asset, if any. Any
        # failure here — no previous tag, no release for that tag, no
        # asset on it (e.g. it predates this feature) — degrades to "no
        # baseline" rather than erroring: `file=` stays empty, and
        # scripts/compare-uat-baseline.sh treats an empty/missing path as
        # `no_baseline` (never a regression). continue-on-error is a second
        # line of defense on top of the `if/else` below, which already
        # never lets this step exit non-zero.
        id: prev_uat
        if: needs.nightly-date.outputs.skip != 'true' && steps.prev.outputs.tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREV="${{ steps.prev.outputs.tag }}"
          OUT="$RUNNER_TEMP/prev-uat-summary.json"
          if gh release download "$PREV" --repo "${{ github.repository }}" \
               -p uat-summary.json -O "$OUT" --clobber 2>"$RUNNER_TEMP/prev-uat-summary.err"; then
            echo "file=$OUT" >> "$GITHUB_OUTPUT"
            echo "Downloaded uat-summary.json from $PREV"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "No uat-summary.json on $PREV (predates the ratchet, or the asset is missing) — treating as no baseline."
            cat "$RUNNER_TEMP/prev-uat-summary.err" || true
          fi

      - name: Compare UAT results against previous nightly
        # Runs scripts/compare-uat-baseline.sh once per non-gating lane
        # (Wine, macOS) — Linux UAT is already fully gating (no
        # continue-on-error on its step), so a Linux regression already
        # fails that job outright and needs no ratchet. See the workflow
        # header and the script's own header comment for the full "what
        # counts as worse" rationale; verified by direct execution against
        # a fixture scenario matrix (see the implementing PR body).
        id: uat_compare
        if: needs.nightly-date.outputs.skip != 'true'
        run: |
          set -euo pipefail
          PREV_FILE="${{ steps.prev_uat.outputs.file }}"

          eval "$(bash scripts/compare-uat-baseline.sh wine_uat "$PREV_FILE" \
            "${{ needs.nightly-windows.result }}" \
            "${{ needs.nightly-windows.outputs.wine-uat-passed }}" \
            "${{ needs.nightly-windows.outputs.wine-uat-total }}" \
            "false")"
          echo "wine-verdict=$VERDICT"           >> "$GITHUB_OUTPUT"
          echo "wine-reason=$REASON_CODE"        >> "$GITHUB_OUTPUT"
          echo "wine-prev-passed=$PREV_PASSED"   >> "$GITHUB_OUTPUT"
          echo "wine-prev-total=$PREV_TOTAL"     >> "$GITHUB_OUTPUT"
          echo "wine-suite-delta=$SUITE_DELTA"   >> "$GITHUB_OUTPUT"
          echo "Wine UAT verdict vs previous nightly: $VERDICT ($REASON_CODE), suite delta ${SUITE_DELTA:-n/a}"

          eval "$(bash scripts/compare-uat-baseline.sh macos_uat "$PREV_FILE" \
            "${{ needs.nightly-macos.result }}" \
            "${{ needs.nightly-macos.outputs.macos-uat-passed }}" \
            "${{ needs.nightly-macos.outputs.macos-uat-total }}" \
            "${{ needs.nightly-macos.outputs.macos-uat-crashed }}")"
          echo "macos-verdict=$VERDICT"          >> "$GITHUB_OUTPUT"
          echo "macos-reason=$REASON_CODE"       >> "$GITHUB_OUTPUT"
          echo "macos-prev-passed=$PREV_PASSED"  >> "$GITHUB_OUTPUT"
          echo "macos-prev-total=$PREV_TOTAL"    >> "$GITHUB_OUTPUT"
          echo "macos-suite-delta=$SUITE_DELTA"  >> "$GITHUB_OUTPUT"
          echo "macOS UAT verdict vs previous nightly: $VERDICT ($REASON_CODE), suite delta ${SUITE_DELTA:-n/a}"

      - name: Build since-last-nightly summary
        id: changelog
        if: needs.nightly-date.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          PREV="${{ steps.prev.outputs.tag }}"
          if [ -n "$PREV" ]; then
            {
              echo "## Changes since $PREV"
              echo
              echo '```'
            } >> "$BODY_FILE"
            # scripts/release-notes.sh already does exactly this: a Keep-a-
            # Changelog-shaped draft from Conventional-Commit prefixes over
            # an arbitrary git range. Reused as-is rather than reinventing a
            # second commit-summarizer.
            scripts/release-notes.sh "$PREV..HEAD" >> "$BODY_FILE"
            echo '```' >> "$BODY_FILE"
          else
            # First nightly: no baseline to diff against, and per the
            # owner's brief this does NOT need to summarize all project
            # history — a short placeholder is enough; future nights get
            # a real diff against this one.
            echo "## Changes since last nightly" >> "$BODY_FILE"
            echo >> "$BODY_FILE"
            echo "First nightly build — no prior nightly baseline to diff against." >> "$BODY_FILE"
          fi
          echo "body-file=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "---- summary preview ----"
          cat "$BODY_FILE"
          echo "---- end preview ----"

      - name: Download lane artifacts
        # No `name:` filter — sweep up whichever of the three lane
        # artifacts exist in THIS run. A failed lane's step never reached
        # its upload, so its artifact simply isn't there; this download
        # step does not need per-lane conditionals. continue-on-error
        # guards the zero-success night (all three lanes failed, so there
        # is nothing at all to download) — undocumented whether the
        # action treats "zero artifacts in the run" as a hard failure, so
        # don't let that possibility take down the rest of this job (the
        # dry-run preview / red-run failure step still need to run).
        if: needs.nightly-date.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Rename artifacts for the release
        id: assets
        if: needs.nightly-date.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          ls -la dist/ || true
          # Count files BEFORE renaming: every downloaded lane artifact
          # MUST end up renamed below. If the post-rename count is lower,
          # some lane's actual staged filename doesn't match a key in the
          # rename map and would otherwise be silently dropped from the
          # release (exactly the bug the macOS staging step above fixes —
          # this assertion is the regression guard for that class of bug,
          # in every mode, not just dry-run).
          pre_count=$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')
          TAG="${{ needs.nightly-date.outputs.tag }}"
          declare -A renames=(
            [nightly-trailer-linux-x86_64.tar.gz]="trailer-${TAG}-linux-x86_64.tar.gz"
            [nightly-trailer-windows-x86_64.zip]="trailer-${TAG}-windows-x86_64.zip"
            [nightly-trailer-macos-arm64.dmg]="trailer-${TAG}-macos-arm64.dmg"
          )
          count=0
          for src in "${!renames[@]}"; do
            if [ -f "dist/$src" ]; then
              mv "dist/$src" "dist/${renames[$src]}"
              count=$((count + 1))
            fi
          done
          if [ "$count" -ne "$pre_count" ]; then
            echo "::error::Downloaded $pre_count artifact(s) in dist/ but only renamed $count — a lane's staged filename doesn't match this step's rename map (see the file listing above)."
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "After rename ($count artifact(s) present):"
          ls -la dist/

      - name: Build release body
        id: body
        if: needs.nightly-date.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          PREV_TAG="${{ steps.prev.outputs.tag }}"

          # Renders one UAT ratchet verdict (from the "Compare UAT results
          # against previous nightly" step, see scripts/compare-uat-
          # baseline.sh) as the human-readable clause appended to each row
          # below — e.g. "unchanged vs nightly-20260728" / "REGRESSED from
          # 40/40 (nightly-20260728)". Keeps the release body the readable
          # record of what the ratchet decided, not just the raw counts.
          #
          # A changed suite SIZE is appended as its own parenthetical note
          # rather than folded into the verdict. The verdict compares
          # absolute passed counts only, so "unchanged" on a night that
          # added three failing regression guards is correct but reads as
          # surprising without the "+3 tests added" note beside it — the
          # note is what makes a flat pass count self-explaining, and it
          # never gates.
          render_suite_delta() {
            local delta="$1" n word
            case "$delta" in
              ""|0) echo ""; return ;;
              -*)   n="${delta#-}" ;;
              *)    n="$delta" ;;
            esac
            if [ "$n" = "1" ]; then word="test"; else word="tests"; fi
            case "$delta" in
              -*) echo " ($n $word removed from the suite)" ;;
              *)  echo " (+$n $word added to the suite)" ;;
            esac
          }

          render_compare() {
            local verdict="$1" prev_passed="$2" prev_total="$3" suite_delta="${4:-}"
            local note
            note="$(render_suite_delta "$suite_delta")"
            case "$verdict" in
              worse)
                if [ -n "$prev_total" ]; then
                  echo "REGRESSED from $prev_passed/$prev_total ($PREV_TAG)$note"
                else
                  echo "REGRESSED vs $PREV_TAG$note"
                fi ;;
              better)
                if [ -n "$prev_total" ]; then
                  echo "IMPROVED from $prev_passed/$prev_total ($PREV_TAG)$note"
                else
                  echo "IMPROVED vs $PREV_TAG$note"
                fi ;;
              same)
                echo "unchanged vs $PREV_TAG$note" ;;
              no_baseline)
                if [ -n "$PREV_TAG" ]; then
                  echo "no baseline to compare (first ratcheted run, or $PREV_TAG has none)"
                else
                  echo "no baseline to compare (first-ever nightly)"
                fi ;;
              unknown)
                echo "comparison skipped (count unavailable this run or in baseline)" ;;
              *)
                echo "" ;;
            esac
          }

          # Windows row carries an extra, NON-GATING annotation: Wine UAT's
          # pass count (owner decision 2026-07-24 — see nightly-windows'
          # "UAT suite (Wine)" step and docs/backlog/2026-07-24-wine-uat-
          # failures-triage.md). A red Windows job result always means
          # build/bundle/unit failed (Wine UAT can never cause that, per
          # continue-on-error on that step), so the ❌ branch below never
          # needs to reference the Wine UAT counts at all.
          WIN_PASSED=""
          WIN_TOTAL=""
          if [ "${{ needs.nightly-windows.result }}" = "success" ]; then
            WIN_PASSED="${{ needs.nightly-windows.outputs.wine-uat-passed }}"
            WIN_TOTAL="${{ needs.nightly-windows.outputs.wine-uat-total }}"
            WIN_COMPARE="$(render_compare "${{ steps.uat_compare.outputs.wine-verdict }}" \
              "${{ steps.uat_compare.outputs.wine-prev-passed }}" "${{ steps.uat_compare.outputs.wine-prev-total }}" \
              "${{ steps.uat_compare.outputs.wine-suite-delta }}")"
            if [ -n "$WIN_TOTAL" ] && [ "$WIN_PASSED" = "$WIN_TOTAL" ]; then
              WIN_ROW="✅ build+unit+UAT (Wine UAT $WIN_PASSED/$WIN_TOTAL) — $WIN_COMPARE"
            elif [ -n "$WIN_TOTAL" ]; then
              WIN_ROW="✅ build+unit, ⚠️ Wine UAT $WIN_PASSED/$WIN_TOTAL — $WIN_COMPARE — non-gating, see docs/backlog/2026-07-24-wine-uat-failures-triage.md"
            else
              WIN_ROW="✅ build+unit, ⚠️ Wine UAT count unavailable this run — $WIN_COMPARE"
            fi
          else
            WIN_ROW="❌ (${{ needs.nightly-windows.result }})"
          fi

          # macOS row mirrors the Windows/Wine-UAT row exactly (owner
          # decision 2026-07-26 — see nightly-macos's "UAT suite" step and
          # docs/backlog/2026-07-26-macos-uat-triage.md), with one addition:
          # a crash is called out explicitly (🔥) rather than folded into
          # an ordinary N/M count, since a SegFault is a categorically more
          # serious signal than a failing assertion.
          MAC_PASSED=""
          MAC_TOTAL=""
          MAC_CRASHED=""
          if [ "${{ needs.nightly-macos.result }}" = "success" ]; then
            MAC_PASSED="${{ needs.nightly-macos.outputs.macos-uat-passed }}"
            MAC_TOTAL="${{ needs.nightly-macos.outputs.macos-uat-total }}"
            MAC_CRASHED="${{ needs.nightly-macos.outputs.macos-uat-crashed }}"
            MAC_COMPARE="$(render_compare "${{ steps.uat_compare.outputs.macos-verdict }}" \
              "${{ steps.uat_compare.outputs.macos-prev-passed }}" "${{ steps.uat_compare.outputs.macos-prev-total }}" \
              "${{ steps.uat_compare.outputs.macos-suite-delta }}")"
            if [ "$MAC_CRASHED" = "true" ]; then
              if [ -n "$MAC_TOTAL" ]; then
                MAC_ROW="✅ build+unit, 🔥 macOS UAT CRASHED ($MAC_PASSED/$MAC_TOTAL) — $MAC_COMPARE — informational, non-gating, see docs/backlog/2026-07-26-macos-uat-triage.md"
              else
                MAC_ROW="✅ build+unit, 🔥 macOS UAT crashed (no count available this run) — $MAC_COMPARE — informational, non-gating, see docs/backlog/2026-07-26-macos-uat-triage.md"
              fi
            elif [ -n "$MAC_TOTAL" ] && [ "$MAC_PASSED" = "$MAC_TOTAL" ]; then
              MAC_ROW="✅ build+unit+UAT ($MAC_PASSED/$MAC_TOTAL) — $MAC_COMPARE"
            elif [ -n "$MAC_TOTAL" ]; then
              MAC_ROW="✅ build+unit, ⚠️ macOS UAT $MAC_PASSED/$MAC_TOTAL — $MAC_COMPARE — non-gating, see docs/backlog/2026-07-26-macos-uat-triage.md"
            else
              MAC_ROW="✅ build+unit, ⚠️ macOS UAT count unavailable this run — $MAC_COMPARE"
            fi
          else
            MAC_ROW="❌ (${{ needs.nightly-macos.result }})"
          fi

          {
            echo "Automated nightly build of Trailer's \`main\` branch. Unsigned,"
            echo "like dev-build.yml's artifacts — see PHILOSOPHY.md for what to"
            echo "expect from a 0.x build. A lane below marked ❌ is NOT included;"
            echo "see its job log in this run for what failed. Windows' Wine UAT"
            echo "and macOS's UAT counts (⚠️/🔥) are informational only — neither"
            echo "blocks the artifact; see each row's linked backlog item. The"
            echo "'REGRESSED'/'IMPROVED'/'unchanged' clause is the UAT ratchet —"
            echo "see the workflow's header comment — and DOES gate the run's own"
            echo "pass/fail signal (never the artifact) when a lane regresses."
            echo
            echo "## Build status"
            echo
            echo "| OS | Result |"
            echo "|---|---|"
            echo "| Linux   | $([ "${{ needs.nightly-linux.result }}" = "success" ] && echo "✅" || echo "❌ (${{ needs.nightly-linux.result }})") |"
            echo "| Windows | $WIN_ROW |"
            echo "| macOS   | $MAC_ROW |"
            echo
            cat "${{ steps.changelog.outputs.body-file }}"
          } >> "$BODY_FILE"
          echo "body-file=$BODY_FILE" >> "$GITHUB_OUTPUT"

          # Write THIS run's own uat-summary.json — becomes tomorrow's
          # ratchet baseline once published below, regardless of tonight's
          # verdict (an improved night ratchets the floor forward; a
          # regressed night still records its own, worse number, so a
          # long-standing plateau at that level reads `same` afterward
          # rather than alarming every night — see the workflow header).
          json_num_or_null() { if [ -n "$1" ]; then echo "$1"; else echo "null"; fi; }
          json_bool_or_null() {
            case "$1" in
              true|false) echo "$1" ;;
              *) echo "null" ;;
            esac
          }
          mkdir -p dist
          cat > dist/uat-summary.json <<EOF
          {
            "schema_version": 1,
            "tag": "${{ needs.nightly-date.outputs.tag }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "lanes": {
              "wine_uat": {
                "job_result": "${{ needs.nightly-windows.result }}",
                "passed": $(json_num_or_null "$WIN_PASSED"),
                "total": $(json_num_or_null "$WIN_TOTAL"),
                "crashed": false
              },
              "macos_uat": {
                "job_result": "${{ needs.nightly-macos.result }}",
                "passed": $(json_num_or_null "$MAC_PASSED"),
                "total": $(json_num_or_null "$MAC_TOTAL"),
                "crashed": $(json_bool_or_null "$MAC_CRASHED")
              }
            }
          }
          EOF
          echo "---- uat-summary.json preview ----"
          cat dist/uat-summary.json
          echo "---- end preview ----"

      - name: Create tag + GitHub Release
        # Skipped entirely when: dry-run (manual test proof — see workflow
        # header), zero lanes succeeded (nothing to publish), or today's
        # tag already exists (idempotent guard, mirroring release-
        # autotag.yml's "refuse if tag already exists" check — here a soft
        # skip rather than a hard failure, since this isn't a human-
        # triggered release gate). The per-day concurrency group (workflow
        # header) closes the realistic race — two REAL runs the same day
        # now serialize instead of racing. A residual TOCTOU still exists
        # between this check and `git push` for anything OUTSIDE that
        # grouping (e.g. a maintainer pushing a same-named tag by hand at
        # the same instant) — that fails LOUDLY at `git push`
        # (already-exists / non-fast-forward), never silently, so it's an
        # acceptable residual gap rather than a correctness bug.
        if: needs.nightly-date.outputs.skip != 'true' && needs.nightly-date.outputs.dry-run != 'true' && steps.assets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.nightly-date.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::Tag $TAG already exists — skipping (already published today)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nightly $TAG"
          git push origin "$TAG"
          # dist/uat-summary.json (written unconditionally by "Build
          # release body", regardless of dry-run) is included alongside
          # the binaries so it becomes TOMORROW's ratchet baseline — see
          # scripts/compare-uat-baseline.sh and the workflow header.
          gh release create "$TAG" dist/trailer-*.* dist/uat-summary.json \
            --repo "${{ github.repository }}" \
            --title "Nightly $TAG" \
            --prerelease \
            --notes-file "${{ steps.body.outputs.body-file }}"
          echo "Published nightly release $TAG"

      - name: Build + sign nightly update feed (appcast-nightly.json)
        # The nightly channel's signed appcast — see
        # docs/decision-records/2026-07-30-nightly-auto-update-channel.md
        # and src/update/UpdateChecker.cpp. Reuses THIS job's existing
        # publishing surface: the feed is uploaded as an additional asset
        # on the SAME nightly release the step above just created/confirmed
        # (`gh release upload`), exactly like uat-summary.json already is —
        # no new hosting mechanism, no GitHub Pages deploy.
        #
        # Gating mirrors "Create tag + GitHub Release" (skip / dry-run /
        # zero-assets all mean no release exists to attach a feed to), plus
        # three independent soft-skips inside the step itself — see the
        # inline `::notice::`/`::warning::` messages for exactly why each
        # one fires. All are non-fatal: a missing feed this run just means
        # UpdateChecker's "newest prerelease WITH an appcast-nightly.json
        # asset" scan (see that file) falls back to the last night that DID
        # publish one, which — since nightly release assets are retained
        # ~6 months (see the retention-cleanup step below) — is virtually
        # always still fetchable.
        #
        # #128 ("skip identical nights") means a night can now legitimately
        # have NO release at all; this step's `skip` check already covers
        # that (nothing new built, nothing new to sign — the previous
        # feed stands).
        if: needs.nightly-date.outputs.skip != 'true' && needs.nightly-date.outputs.dry-run != 'true' && steps.assets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # Base64-encoded ed25519 PRIVATE key PEM (see
          # src/update/UpdatePublicKey.h for the matching public key and the
          # exact `openssl genpkey` / `base64` commands to generate and
          # store this secret). Absent on a fork or before the owner
          # provisions it — the soft-skip below handles that, not a hard
          # failure, so PRs from forks (which never see repo secrets) don't
          # break on this step.
          TRAILER_UPDATE_SIGNING_KEY_B64: ${{ secrets.TRAILER_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ needs.nightly-date.outputs.tag }}"
          MACOS_DMG="dist/trailer-${TAG}-macos-arm64.dmg"

          if [ ! -f "$MACOS_DMG" ]; then
            echo "::notice::No macOS artifact this run (mac lane didn't publish tonight) — skipping the signed update feed. UpdateChecker falls back to the previous night's feed automatically."
            exit 0
          fi
          if [ -z "${TRAILER_UPDATE_SIGNING_KEY_B64:-}" ]; then
            echo "::warning::TRAILER_UPDATE_SIGNING_KEY secret is not set — skipping the signed update feed for tonight. See docs/decision-records/2026-07-30-nightly-auto-update-channel.md for the exact key-generation and secret-storage commands."
            exit 0
          fi
          # "Create tag + GitHub Release" above may have exited early (its
          # own idempotent guard) if today's tag/release already existed
          # from an earlier real run today — confirm the release actually
          # exists before trying to attach an asset to it.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::No GitHub Release found for $TAG — skipping the signed update feed."
            exit 0
          fi

          KEY_FILE="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s' "$TRAILER_UPDATE_SIGNING_KEY_B64" | base64 -d > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          PAYLOAD_FILE="$RUNNER_TEMP/appcast-payload.json"
          TAG="$TAG" \
          BUILD_NUMBER="$(git rev-list --count HEAD)" \
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          MACOS_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/trailer-${TAG}-macos-arm64.dmg" \
          MACOS_SHA="$(sha256sum "$MACOS_DMG" | awk '{print $1}')" \
          python3 scripts/build-nightly-appcast-payload.py "$PAYLOAD_FILE"

          scripts/sign-update-feed.sh "$PAYLOAD_FILE" "$KEY_FILE" dist/appcast-nightly.json
          gh release upload "$TAG" dist/appcast-nightly.json --repo "${{ github.repository }}" --clobber
          echo "Published signed update feed for $TAG (build $(git rev-list --count HEAD))"

      - name: Dry-run preview
        if: needs.nightly-date.outputs.skip != 'true' && needs.nightly-date.outputs.dry-run == 'true'
        run: |
          echo "## Nightly dry run — nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Would have tagged: \`${{ needs.nightly-date.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Would have attached (${{ steps.assets.outputs.count }}):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(none)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "### Release body preview" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.body.outputs.body-file }}" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "### UAT ratchet verdict (would still gate the RUN even in dry-run)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Wine UAT: \`${{ steps.uat_compare.outputs.wine-verdict }}\` (${{ steps.uat_compare.outputs.wine-reason }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- macOS UAT: \`${{ steps.uat_compare.outputs.macos-verdict }}\` (${{ steps.uat_compare.outputs.macos-reason }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Retention cleanup (delete releases older than 6 months, keep tags)
        # ~183 days. Deletes the GitHub Release object (and its assets)
        # via `gh release delete` WITHOUT --cleanup-tag, so the underlying
        # git tag is never touched — nightly-YYYYMMDD..HEAD diffing and
        # bisecting an old nightly both keep working indefinitely. Only
        # the multi-hundred-MB binary assets age out. Skipped on dry-run
        # so a test dispatch never deletes real history. Each delete call
        # is soft-failed (`|| echo "::warning::..."`) rather than letting
        # `set -e` abort the loop — a release that's already gone, or a
        # transient API hiccup, is housekeeping noise and must not be
        # conflated with (or mask) the per-lane failure signal the next
        # step reports. Also skipped entirely on a skip night — nothing
        # published tonight, so there is nothing new to age-check, and
        # running it anyway would just be a no-op API scan on every
        # no-op night.
        if: needs.nightly-date.outputs.skip != 'true' && needs.nightly-date.outputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '183 days ago' +%Y-%m-%d)
          echo "Deleting nightly-* releases published before $CUTOFF (assets only; tags kept)."
          # --limit 400 comfortably covers the ~183-day retention window
          # at one real nightly per day (≈183 releases) plus headroom for
          # irregular entries; gh release list silently stops paginating
          # past this limit, so raise it if the daily cadence or window
          # ever changes.
          gh release list --repo "${{ github.repository }}" --limit 400 \
            --json tagName,publishedAt \
            --jq '.[] | select(.tagName | startswith("nightly-")) | "\(.tagName) \(.publishedAt)"' \
            | while read -r tag published; do
                pub_date="${published%%T*}"
                if [[ "$pub_date" < "$CUTOFF" ]]; then
                  echo "Deleting $tag (published $pub_date, tag kept)"
                  gh release delete "$tag" --repo "${{ github.repository }}" --yes \
                    || echo "::warning::Failed to delete aged-out nightly release $tag (already gone, or a transient API error) — continuing."
                fi
              done

      - name: Fail the run if any lane didn't fully pass
        # This is what surfaces a lane failure: even though the release
        # (if any lane went green) already published above, this step
        # makes the WORKFLOW RUN itself red whenever a lane isn't a clean
        # success — which is what triggers GitHub's built-in "scheduled
        # workflow failed" notification to repo watchers, no issues:write
        # permission or dedup logic required. `always()` is required here:
        # without it, an earlier step failing (e.g. a retention-cleanup
        # hiccup that somehow still aborted despite the soft-fail above)
        # would SKIP this step by default, losing the per-lane diagnostic
        # and conflating an unrelated housekeeping failure with the lane
        # signal this step exists to report. Also guarded on `skip != 'true'`
        # — on a skip night the three lanes never ran at all, so their
        # `result` is `skipped`, not `success`; without this guard a green
        # skip night would incorrectly red itself here.
        if: |
          always() && needs.nightly-date.outputs.skip != 'true' &&
          (needs.nightly-linux.result != 'success' ||
           needs.nightly-windows.result != 'success' ||
           needs.nightly-macos.result != 'success')
        run: |
          echo "::error::At least one nightly lane did not fully pass (build + unit + UAT). Linux=${{ needs.nightly-linux.result }} Windows=${{ needs.nightly-windows.result }} macOS=${{ needs.nightly-macos.result }}"
          exit 1

      - name: Fail the run if UAT regressed vs the previous nightly
        # THE RATCHET (see the workflow header and scripts/compare-uat-
        # baseline.sh): Wine UAT and macOS UAT are non-gating per-lane
        # (continue-on-error, see those steps' comments), so a lane's job
        # `result` can be `success` here even when its UAT count is bad or
        # its crash flag is set — that's intentional, and the step above
        # doesn't (and shouldn't) catch it. This step adds the missing
        # signal: it reds the RUN — never the lane, never the artifact,
        # which already published above regardless — specifically when
        # `scripts/compare-uat-baseline.sh` (run in "Compare UAT results
        # against previous nightly") judged a lane WORSE than the
        # immediately previous nightly's published result. Equal-or-better
        # (including `no_baseline`/`unknown` — never treated as a
        # regression, see the script's header) stays green here, matching
        # "the ratchet only tightens" (AGENTS.md). `always()` for the same
        # reason as the step above: an unrelated earlier failure must not
        # silently skip this diagnostic. `skip != 'true'` is belt-and-
        # suspenders here — "Compare UAT results" never ran on a skip
        # night, so its outputs are empty and can't equal 'worse' anyway —
        # but stated explicitly rather than relied on implicitly.
        if: |
          always() && needs.nightly-date.outputs.skip != 'true' &&
          (steps.uat_compare.outputs.wine-verdict == 'worse' ||
           steps.uat_compare.outputs.macos-verdict == 'worse')
        run: |
          echo "::error::UAT regressed vs the previous nightly — see the release body's per-OS table for the counts. Wine=${{ steps.uat_compare.outputs.wine-verdict }} (${{ steps.uat_compare.outputs.wine-reason }}) macOS=${{ steps.uat_compare.outputs.macos-verdict }} (${{ steps.uat_compare.outputs.macos-reason }})"
          exit 1
