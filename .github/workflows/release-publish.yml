# Tag-triggered release publication.
#
# On `git push --tags` for `v*`, look up the most recent successful
# Release workflow run for the same commit SHA, download its
# artifacts, and attach them to a GitHub Release. No rebuild — the
# bytes shipped are exactly the bytes the release-candidate PR
# validated.
#
# The Release workflow (release.yml) is *not* triggered by tag push;
# only by release-candidate-labeled PRs and workflow_dispatch. So the
# usual flow is:
#
#   1. Open a release PR that bumps VERSION off its -dev suffix.
#   2. Add the `release-candidate` label. Release workflow builds
#      Linux/Windows/macOS-universal artifacts + runs UAT.
#   3. Once green, merge the PR (using a merge policy that preserves
#      the PR HEAD SHA — fast-forward or merge-commit, NOT squash;
#      see README's "Release process" section).
#   4. Tag that commit: `git tag v0.1.0 && git push origin v0.1.0`.
#   5. This workflow fires, finds the build, attaches artifacts.
#
# If a tag is pushed for a SHA that was never built (e.g. squash
# merge dropped it, or the maintainer tagged a different commit),
# this workflow fails with a clear message. The recovery path is to
# `gh workflow run Release --ref=<SHA>` to seed artifacts, then
# re-run this workflow's failed job.

name: Publish Release

on:
  push:
    tags:
      - 'v*'
  # release-autotag.yml dispatches this workflow after pushing the tag
  # (a tag push made under GITHUB_TOKEN doesn't trigger downstream
  # workflows, so the autotag job has to call us explicitly).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Defaults to the ref this workflow is run from.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Attach prior build to GitHub Release
    runs-on: trailer-k8s
    timeout-minutes: 10
    permissions:
      # Required by softprops/action-gh-release to create / update
      # the GitHub Release object and upload assets.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target tag + SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On tag push: github.ref_name is the tag, github.sha is its
          # commit. On workflow_dispatch: resolve from the input (or
          # fall back to the ref the workflow is dispatched from).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="${{ github.ref_name }}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          SHA=$(git rev-list -n 1 "$TAG")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (commit $SHA)"

      - name: Find prior successful Release run for this SHA
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          echo "Looking up 'Release' workflow runs for commit $SHA"
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=Release \
            --commit="$SHA" \
            --status=success \
            --limit=5 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            cat >&2 <<EOF
          ::error::no successful Release workflow run found for $SHA.
          To recover:
            1. Trigger a Release build for this commit:
                 gh workflow run Release --ref=$SHA
            2. Wait for it to finish successfully.
            3. Re-run this job from the Actions tab (or push the tag
               again after deleting the failing run).
          EOF
            exit 1
          fi
          echo "Found Release run: $RUN_ID"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from prior build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.find-run.outputs.run-id }}
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: List + rename artifacts for the release
        # In-workflow artifact names are stable (no version) so the
        # cross-run download lookup above works regardless of which
        # release a build came from. The user-visible filenames on the
        # GitHub Release should carry the version, though — rename
        # to trailer-${V}-<platform>.<ext> before handing the files
        # to action-gh-release.
        run: |
          set -euo pipefail
          ls -la dist/
          # tag is e.g. "v0.1.0"; strip the leading "v" for the
          # filename so users see trailer-0.1.0-linux-x86_64.tar.gz
          # (matching how `--version` and the About dialog print it).
          TAG="${{ steps.target.outputs.tag }}"
          V="${TAG#v}"
          declare -A renames=(
            [trailer-linux-x86_64.tar.gz]="trailer-${V}-linux-x86_64.tar.gz"
            [trailer-windows-x86_64.zip]="trailer-${V}-windows-x86_64.zip"
            [trailer-macos-arm64.dmg]="trailer-${V}-macos-arm64.dmg"
          )
          for src in "${!renames[@]}"; do
            if [ ! -f "dist/$src" ]; then
              echo "::error::expected artifact dist/$src is missing — run ${{ steps.find-run.outputs.run-id }} likely skipped a platform"
              exit 1
            fi
            mv "dist/$src" "dist/${renames[$src]}"
          done
          echo "After rename:"
          ls -la dist/

      - name: Build release body
        id: body
        run: |
          set -euo pipefail
          TAG="${{ steps.target.outputs.tag }}"
          V="${TAG#v}"

          BODY_FILE="$(mktemp)"

          # Splice in the CHANGELOG section for this version, when one
          # exists. extract-changelog.sh exits non-zero if there's no
          # `## [V] - DATE` heading — we fall back to a "no changelog"
          # marker so the maintainer notices and edits the release in
          # the UI rather than shipping a silent boilerplate-only body.
          if [ -f CHANGELOG.md ] && scripts/extract-changelog.sh "$V" > "$BODY_FILE.changelog" 2>/dev/null; then
              printf '## What changed\n\n'                  >> "$BODY_FILE"
              cat "$BODY_FILE.changelog"                    >> "$BODY_FILE"
              printf '\n\nFull changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/'"$TAG"'/CHANGELOG.md).\n\n---\n\n' >> "$BODY_FILE"
          else
              printf '<!-- No CHANGELOG.md section found for %s. Edit this release in the UI to add release notes. -->\n\n' "$V" >> "$BODY_FILE"
              echo "::warning::No CHANGELOG.md section for $V found — release body will use the install-instructions boilerplate only. Run scripts/extract-changelog.sh $V locally to verify the section heading matches."
          fi

          # Install-instructions boilerplate. Kept here (not in
          # CHANGELOG) because it's per-platform mechanics that don't
          # change release-over-release; the CHANGELOG is what changes.
          cat >> "$BODY_FILE" <<EOF
          See PHILOSOPHY.md for what to expect from a 0.x build of
          Trailer.

          ### macOS (Apple Silicon): drag-to-Applications install

          The \`.dmg\` mounts to a Finder window with \`Trailer.app\`
          and an \`Applications\` shortcut — drag to install. The
          bundled \`.app\` is **Apple Silicon only** for now (ONNX
          Runtime, which powers Trailer's ML features, no longer
          ships a macOS x86_64 / universal2 prebuilt). An Intel-Mac
          binary — either an ML-disabled build or a third-party ONNX
          bundle — is tracked as future work; until then Intel-Mac
          users can build from source via \`scripts/build-macos.sh\`
          on their host.

          The \`.app\` ships **unsigned and un-notarized** by project
          policy. First launch triggers Gatekeeper; bypass the
          quarantine flag once after install:

              xattr -dr com.apple.quarantine /Applications/Trailer.app

          …or right-click the \`.app\` → Open → Open.

          ### Windows

          The \`.zip\` contains \`trailer.exe\` alongside every DLL it
          transitively loads (Qt, qpdf, MinGW runtime) plus the Qt
          Windows platform plugin. Extract anywhere and run. The
          binary is signed-by-no-one, so Smart Screen may warn on
          first run; click "More info" → "Run anyway".

          ### Linux

          The \`.tar.gz\` contains a dynamically-linked binary that
          expects system Qt 6 + qpdf 11+. On Ubuntu 24.04 (noble):

              sudo apt install libqt6core6 libqt6gui6 libqt6widgets6 \\
                               libqt6pdf6 libqt6pdfwidgets6 libqpdf28

          Native \`.deb\` / \`.rpm\` packages and AppImage / Flatpak
          distribution are tracked as a separate effort.
          EOF

          echo "body-file=$BODY_FILE" >> "$GITHUB_OUTPUT"

          echo "---- Release body preview ----"
          cat "$BODY_FILE"
          echo "---- end preview ----"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          # Full release by default. A maintainer who wants to ship a
          # pre-release tag (e.g. v0.2.0-rc1) can edit the release in
          # the UI to flip the "Set as pre-release" checkbox after
          # the workflow attaches the artifacts. Auto-detection from
          # VERSION suffix is a future refinement — would require
          # precheck.yml to accept -rc / -beta / -alpha tails too.
          prerelease: false
          # Glob the versioned filenames written by the rename step.
          files: dist/trailer-*
          body_path: ${{ steps.body.outputs.body-file }}
