# Release-artifact build pipeline.
#
# Builds the self-contained per-platform release artifacts and runs
# UAT. Triggered by:
#   - Pull requests carrying the `release-candidate` label. The
#     `labeled` event re-fires the workflow when the label is added
#     to an existing PR, so artifact builds don't require a force-push
#     after labeling.
#   - Manual `workflow_dispatch` (e.g. building a tag SHA after the
#     fact to seed the Publish Release workflow).
#
# Intentionally NOT triggered on tag push — the companion Publish
# Release workflow (release-publish.yml) handles tag pushes by
# promoting an already-successful Release run's artifacts to a
# GitHub Release. See README's "Release process" section.
#
# precheck enforces that the top-level VERSION file has been bumped
# off its -dev suffix before any heavy build burns CI minutes. All
# build jobs `needs: [precheck]`, so a stale VERSION fails fast and
# cheap (a ~30s Linux job) instead of after a 30-min macOS run.
#
# TRAILER_WERROR is OFF in CI: too many warnings fire from inside
# Qt / libstdc++ / qpdf system headers (false-positive
# -Wnull-dereference template-instantiation noise, qpdf's
# POINTERHOLDER_TRANSITION cpp #warning, etc.) to make strict
# warnings-as-errors workable here. Warnings still print in the
# build log; trailer's own source is kept warning-clean by review.

name: Release

on:
  pull_request:
    # `labeled` is in the list so adding the release-candidate label
    # to an open PR retriggers the workflow — without it, the heavy
    # jobs wouldn't run until the next commit lands on the PR. The
    # precheck `if:` below filters to the release-candidate label
    # specifically so adding an unrelated label (e.g. `bug`) to an
    # RC PR doesn't re-burn macOS minutes.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precheck:
    # Pre-flight gate. On a release-candidate PR (or workflow_dispatch),
    # confirm the VERSION file doesn't still carry a -dev / -rc suffix.
    # All heavy build jobs `needs: [precheck]`, so the macOS / Windows
    # runners only burn minutes when the PR is actually a release
    # candidate.
    name: Pre-flight checks
    runs-on: ubuntu-24.04
    # Run when: (a) manual dispatch, (b) any push to an RC-labeled PR
    # (opened/synchronize/reopened), or (c) the `release-candidate`
    # label specifically being added. Adding any *other* label to an
    # RC PR also fires a `labeled` event but the action.label.name
    # check below skips it.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'release-candidate'
        )
      )
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read-version
        name: Validate VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing at the repo root"
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "VERSION=$VERSION"
          # On PR runs (i.e. release-candidate label applied), the
          # version must already be its target release value — no -dev
          # or -rc tail. Dispatch runs bypass this so a maintainer
          # can poke a build for any SHA (e.g. retroactively seeding
          # artifacts for a tag).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if echo "$VERSION" | grep -qE -- '-dev$|-rc[0-9]*$'; then
              echo "::error::VERSION='$VERSION' still carries a -dev/-rc suffix. Edit the VERSION file (and re-run cmake locally to regenerate TrailerVersion.h) before re-applying the release-candidate label."
              exit 1
            fi
            # Refuse to spend macOS/Windows minutes rebuilding a
            # version that has already shipped. If the maintainer
            # genuinely needs to re-cut, they can bump VERSION and
            # try again.
            TAG="v$VERSION"
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::A GitHub Release for $TAG already exists. Bump VERSION before re-applying the release-candidate label."
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/$TAG" 2>/dev/null | grep -q .; then
              echo "::error::A git tag $TAG already exists upstream (without an attached release). Bump VERSION, or delete the dangling tag first."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux-build:
    needs: [precheck]
    name: Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ runner.os }}-gcc-linux
          max-size: 500M

      - name: Configure
        # TRAILER_WERROR stays OFF: GCC's -Wnull-dereference and -Wcpp
        # fire from inside Qt's qwidget.h, libstdc++ iterator headers,
        # and qpdf's PointerHolder.hh — system-header noise we can't
        # fix locally. Warnings still print in the log.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Stage Linux artifact
        # Bundle the binary plus a minimal README so users who
        # download the zip have something to read. Distro packaging
        # (.deb / .AppImage / Flatpak) is a separate exercise; this
        # zip expects system Qt + qpdf to be installed via the user's
        # package manager (see README's "Install" section).
        run: |
          mkdir -p dist/trailer-linux-x86_64
          cp build/trailer dist/trailer-linux-x86_64/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-linux-x86_64/
          (cd dist && tar -czf trailer-linux-x86_64.tar.gz trailer-linux-x86_64)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-linux-x86_64
          path: dist/trailer-linux-x86_64.tar.gz
          retention-days: 30

  windows-cross:
    needs: [precheck]
    name: Windows cross-build (mingw-w64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Build Windows image
        # The Dockerfile pins Qt + qpdf + mingw versions so the
        # produced trailer.exe matches what scripts/build-windows.sh
        # produces locally on a developer's Linux box.
        run: docker build -t trailer-windows -f docker/windows/Dockerfile .

      - name: Cross-compile trailer.exe
        # --in-container skips the docker-build branch since we just
        # built the image; the script then runs the cmake +
        # collect_dlls passes that produce build-windows/trailer.exe
        # alongside every transitively-loaded DLL. The result is a
        # fully self-contained directory — no separate Qt/qpdf install
        # needed on the user's Windows machine.
        run: |
          docker run --rm -v "$PWD":/work -w /work trailer-windows \
            bash scripts/build-windows.sh --in-container

      - name: Stage Windows artifact
        run: |
          # docker writes build-windows/ as root; reclaim ownership
          # before the host-side cp can write into it.
          sudo chown -R "$(id -u):$(id -g)" build-windows
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             build-windows/
          (cd build-windows && zip -r ../trailer-windows-x86_64.zip .)
          mkdir -p dist
          mv trailer-windows-x86_64.zip dist/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-windows-x86_64
          path: dist/trailer-windows-x86_64.zip
          retention-days: 30

  macos-build:
    needs: [precheck]
    name: macOS .app build (Apple Silicon)
    # macos-14 is Apple Silicon. The artifact is arm64-only because
    # ONNX Runtime stopped shipping macOS x86_64 / universal2
    # prebuilts (only `onnxruntime-osx-arm64-X.Y.Z.tgz` exists), and
    # ORT is on trailer's link path for ML features. Intel-Mac users
    # can build from source via scripts/build-macos.sh on their host.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        # install-qt-action's macOS Qt has been universal (arm64 +
        # x86_64) since Qt 6.2, so a single install covers both arches
        # of the universal trailer.app. Keep this in lockstep with
        # setup-linux-build's Qt version. The action exports
        # $QT_ROOT_DIR which scripts/build-macos.sh consumes.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: 'qtpdf'
          cache: true

      - name: Install build deps
        run: brew install ninja

      - name: Build, bundle, and package
        # scripts/build-macos.sh is the source of truth for the macOS
        # release build: static-universal qpdf from source, universal
        # trailer build, macdeployqt to bundle Qt frameworks, lipo +
        # otool verification, and DMG packaging. Running the same
        # script locally (`make release-macos`) produces the same
        # output, so a green local run is a strong CI signal.
        run: scripts/build-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-macos-arm64
          path: dist/trailer-macos-arm64.dmg
          retention-days: 30

  uat:
    needs: [precheck]
    name: UAT
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build UAT image
        run: docker build -t trailer-uat -f docker/uat/Dockerfile .
      - name: Run UAT suite
        # scripts/run-uat.sh --in-container does the cmake configure
        # + build + ctest -L uat dance with the right Qt platform
        # plugin available.
        run: |
          docker run --rm -v "$PWD":/work -w /work trailer-uat \
            bash scripts/run-uat.sh --in-container
