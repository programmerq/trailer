# Release-artifact build pipeline.
#
# Builds the self-contained per-platform release artifacts and runs
# UAT. Triggered by:
#   - Pull requests carrying the `release-candidate` label. The
#     `labeled` event re-fires the workflow when the label is added
#     to an existing PR, so artifact builds don't require a force-push
#     after labeling.
#   - Manual `workflow_dispatch` (e.g. building a tag SHA after the
#     fact to seed the Publish Release workflow).
#
# Intentionally NOT triggered on tag push — the companion Publish
# Release workflow (release-publish.yml) handles tag pushes by
# promoting an already-successful Release run's artifacts to a
# GitHub Release. See README's "Release process" section.
#
# precheck reads the top-level VERSION file and decides whether to
# run the heavy build jobs: if VERSION still carries a -dev / -rc
# suffix, precheck succeeds (with a `::warning::` + step-summary
# message) and emits `is-release-ready=false`. Heavy jobs gate on
# that flag, so a not-yet-bumped VERSION shows up on the PR page as
# precheck ✅ + heavy jobs skipped, rather than a noisy ❌.
#
# An already-published v$VERSION tag or release is a real bug
# (duplicate release attempt) and stays a hard precheck failure.
#
# TRAILER_WERROR is OFF in CI: too many warnings fire from inside
# Qt / libstdc++ / qpdf system headers (false-positive
# -Wnull-dereference template-instantiation noise, qpdf's
# POINTERHOLDER_TRANSITION cpp #warning, etc.) to make strict
# warnings-as-errors workable here. Warnings still print in the
# build log; trailer's own source is kept warning-clean by review.

name: Release

on:
  pull_request:
    # `labeled` is in the list so adding the release-candidate label
    # to an open PR retriggers the workflow — without it, the heavy
    # jobs wouldn't run until the next commit lands on the PR. The
    # precheck `if:` below filters to the release-candidate label
    # specifically so adding an unrelated label (e.g. `bug`) to an
    # RC PR doesn't re-burn macOS minutes.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cap build/test parallelism on the self-hosted trailer-k8s pods: the
# bare `cmake --build … --parallel` steps honor CMAKE_BUILD_PARALLEL_LEVEL
# when no explicit job count is given, and unbounded parallelism OOMKilled
# the linux-build pod. Conservative caps for a green first retry; raise
# once pod memory headroom is known.
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2

jobs:
  precheck:
    # Read VERSION + emit `is-release-ready` flag. Heavy build jobs
    # `if: needs.precheck.outputs.is-release-ready == 'true'`, so a
    # not-yet-bumped VERSION ('-dev' / '-rc' suffix) ends up as
    # precheck ✅ + heavy jobs skipped rather than precheck ❌. The
    # already-released check still fails red because that's a real
    # duplicate-release bug.
    name: Pre-flight checks
    runs-on: trailer-k8s
    # Run when: (a) manual dispatch, (b) any push to an RC-labeled PR
    # (opened/synchronize/reopened), or (c) the `release-candidate`
    # label specifically being added. Adding any *other* label to an
    # RC PR also fires a `labeled` event but the action.label.name
    # check below skips it.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.pull_request.labels.*.name, 'release-candidate') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'release-candidate'
        )
      )
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      is-release-ready: ${{ steps.read-version.outputs.is-release-ready }}
    steps:
      - uses: actions/checkout@v7
      - id: read-version
        name: Read + validate VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing at the repo root"
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # workflow_dispatch is an explicit "build this SHA" ask from a
          # maintainer, so the dev-suffix gate doesn't apply. On a
          # pull_request, a -dev / -rc VERSION means "release work in
          # progress" — skip heavy build jobs and warn, instead of
          # turning the PR red.
          IS_RELEASE_READY=true
          if echo "$VERSION" | grep -qE -- '-dev$|-rc[0-9]*$'; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              IS_RELEASE_READY=false
              echo "::warning::VERSION='$VERSION' still carries a -dev/-rc suffix; release-candidate heavy build jobs are skipped. Bump VERSION (and re-run cmake locally to regenerate TrailerVersion.h) to trigger the full build."
              {
                echo "## Release build skipped"
                echo
                echo "VERSION='\`$VERSION\`' still carries a development suffix. Bump it (drop the \`-dev\` / \`-rc\` tail and commit) to trigger the full release-candidate build on the next push."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "is-release-ready=$IS_RELEASE_READY" >> "$GITHUB_OUTPUT"

          # Once VERSION is release-ready, refuse to spend macOS/Windows
          # minutes rebuilding a version that has already shipped — this
          # is a real bug (duplicate release attempt), worth surfacing
          # red. Skipped when IS_RELEASE_READY=false because dev-version
          # tags wouldn't follow the v$VERSION pattern anyway.
          if [ "$IS_RELEASE_READY" = "true" ]; then
            TAG="v$VERSION"
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::A GitHub Release for $TAG already exists. Bump VERSION before re-applying the release-candidate label."
              exit 1
            fi
            if git ls-remote --tags origin "refs/tags/$TAG" 2>/dev/null | grep -q .; then
              echo "::error::A git tag $TAG already exists upstream (without an attached release). Bump VERSION, or delete the dangling tag first."
              exit 1
            fi
          fi

  linux-build:
    # UAT gates the per-OS build matrix: a UAT failure short-circuits
    # the release before any expensive artifact is built (see the
    # release-uat-before-build backlog item). precheck stays in
    # `needs:` because the `if:` references needs.precheck.outputs.*;
    # a plain (non-always()) `if:` still requires every listed need to
    # succeed, so adding `uat` orders this job after it and fails fast.
    needs: [precheck, uat]
    if: needs.precheck.outputs.is-release-ready == 'true'
    name: Linux build
    runs-on: trailer-k8s
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-linux-build

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: release-${{ runner.os }}-gcc-linux
          max-size: 500M
          # Custom trailer-runner image ships an empty apt index, so the
          # action must run `apt-get update` before `apt-get install ccache`.
          update-package-index: true

      - name: Configure
        # TRAILER_WERROR stays OFF: GCC's -Wnull-dereference and -Wcpp
        # fire from inside Qt's qwidget.h, libstdc++ iterator headers,
        # and qpdf's PointerHolder.hh — system-header noise we can't
        # fix locally. Warnings still print in the log.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        working-directory: build
        run: ctest -C Release --output-on-failure --label-exclude uat
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Stage Linux artifact
        # Bundle the binary plus a minimal README so users who
        # download the zip have something to read. Distro packaging
        # (.deb / .AppImage / Flatpak) is a separate exercise; this
        # zip expects system Qt + qpdf to be installed via the user's
        # package manager (see README's "Install" section).
        run: |
          mkdir -p dist/trailer-linux-x86_64
          cp build/trailer dist/trailer-linux-x86_64/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-linux-x86_64/
          (cd dist && tar -czf trailer-linux-x86_64.tar.gz trailer-linux-x86_64)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-linux-x86_64
          path: dist/trailer-linux-x86_64.tar.gz
          retention-days: 30

  windows-cross:
    # UAT gates the per-OS build matrix: a UAT failure short-circuits
    # the release before any expensive artifact is built (see the
    # release-uat-before-build backlog item). precheck stays in
    # `needs:` because the `if:` references needs.precheck.outputs.*;
    # a plain (non-always()) `if:` still requires every listed need to
    # succeed, so adding `uat` orders this job after it and fails fast.
    needs: [precheck, uat]
    if: needs.precheck.outputs.is-release-ready == 'true'
    name: Windows cross-build (mingw-w64)
    # Runs directly on the self-hosted trailer-k8s pods — NO Docker.
    # The pods have no Docker daemon, so the previous `docker build …
    # docker/windows/Dockerfile` approach can't run here; it's folded
    # onto the same dockerless path CI's `windows-cross-build` job
    # proved green (setup-windows-cross composite installs the mingw-w64
    # + Wine + Qt(win64_mingw) + qpdf toolchain on the runner). The only
    # release-specific difference from CI is the artifact shape: this job
    # zips the bundled directory into trailer-windows-x86_64.zip because
    # release-publish.yml's rename step looks for dist/trailer-windows-
    # x86_64.zip when promoting a build to a GitHub Release.
    runs-on: trailer-k8s
    # Wine is slow on the low-power trailer-k8s Xeons and the first cold
    # run cross-builds qpdf/libjpeg and downloads Qt (~2.6 GB) before the
    # cache warms — keep the release-job headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-cross

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Separate key from the native-gcc linux-build job: this is a
          # different compiler (mingw-w64 g++) targeting Windows.
          key: release-windows-cross-mingw
          max-size: 500M
          # Custom trailer-runner image ships an empty apt index, so the
          # action must run `apt-get update` before `apt-get install ccache`.
          update-package-index: true

      - name: Configure
        # Same invocation as scripts/build-windows.sh (reusing the
        # repo's cmake/toolchain-mingw-w64.cmake) plus the two additions
        # the k8s egress policy forces — the ONNX FetchContent-source
        # override (the release-asset download 403s through the proxy)
        # and the ccache launcher. Mirrors CI's windows-cross-build.
        # TRAILER_WERROR stays OFF (see workflow header).
        run: >-
          cmake -S . -B build-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-mingw-w64.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH="$QT_WIN_DIR;$QPDF_DIR"
          -DQT_HOST_PATH="$QT_HOST_DIR"
          -Dqpdf_DIR="$QPDF_DIR/lib/cmake/qpdf"
          -DFETCHCONTENT_SOURCE_DIR_ONNXRUNTIME_PREBUILT="$ORT_WIN_DIR"
        env:
          # Pin pkg-config to the mingw sysroot so nothing picks up host
          # -dev packages and injects -isystem /usr/include into the
          # mingw compile. Harmless if host libs absent.
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig

      - name: Build
        run: cmake --build build-win --parallel

      - name: Bundle self-contained trailer.exe
        # Reuse scripts/build-windows.sh's collect_dlls import-table walk
        # (BFS over the PE import table via objdump). The pre-built
        # build-win/ already exists, so --in-container skips its
        # configure branch, runs a no-op incremental build, then copies
        # trailer.exe + every transitively-loaded DLL + platforms/
        # qwindows.dll into OUT_DIR. imageformats/ is added on top
        # (trailer's JPEG export loads qjpeg.dll at runtime; the
        # import-table walk can't see runtime-loaded plugins).
        run: |
          set -euo pipefail
          BUILD_DIR="$PWD/build-win" \
          OUT_DIR="$PWD/dist/trailer-windows-x86_64" \
          QT_DIR="$QT_WIN_DIR" \
          QT_HOST_DIR="$QT_HOST_DIR" \
          QPDF_DIR="$QPDF_DIR" \
            bash scripts/build-windows.sh --in-container
          mkdir -p dist/trailer-windows-x86_64/imageformats
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll dist/trailer-windows-x86_64/imageformats/
          cp LICENSE THIRD_PARTY_LICENSES.md PHILOSOPHY.md README.md \
             dist/trailer-windows-x86_64/

      - name: Wine unit tests
        # Cheap Windows-behaviour insurance before shipping a release:
        # same `--label-exclude 'uat|perf'` selector CI's windows-cross-
        # build job runs (26/26 green locally). The UAT tier needs a
        # windowed platform plugin Wine's offscreen doesn't provide, and
        # wall-time perf budgets are noise under the Wine emulator — they
        # run natively on Linux (the project's no-CI-wall-time-gate
        # ruling). Every test
        # .exe lands in build-win/ root, so the DLLs it loads must sit
        # beside it — copy the Bundle step's import-walked DLLs back next
        # to the exes, then add the two test-only extras the import walk
        # can't see: Qt6Test.dll (only test binaries link it) and the
        # runtime-loaded plugin dirs platforms/ + imageformats/.
        timeout-minutes: 30
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
          DISPLAY: ''
          QT_QPA_PLATFORM: offscreen
          PKG_CONFIG_LIBDIR: /usr/x86_64-w64-mingw32/lib/pkgconfig:${{ env.MINGW_PREFIX }}/lib/pkgconfig
        run: |
          set -euo pipefail
          wine wineboot --init
          cmake -S . -B build-win -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/wine
          cp dist/trailer-windows-x86_64/*.dll build-win/
          cp "$QT_WIN_DIR/bin/Qt6Test.dll" build-win/
          mkdir -p build-win/platforms build-win/imageformats
          cp "$QT_WIN_DIR"/plugins/platforms/qoffscreen.dll \
             "$QT_WIN_DIR"/plugins/platforms/qminimal.dll \
             "$QT_WIN_DIR"/plugins/platforms/qwindows.dll build-win/platforms/
          cp "$QT_WIN_DIR"/plugins/imageformats/*.dll build-win/imageformats/
          cd build-win
          ctest -C Release --label-exclude 'uat|perf' --output-on-failure

      - name: Stage Windows artifact
        # Zip the bundled directory into the exact filename
        # release-publish.yml's rename step expects (dist/trailer-
        # windows-x86_64.zip). trailer.exe sits at the zip root so
        # extracting anywhere and running it Just Works, matching the
        # release notes' Windows instructions. Uses 7z (p7zip-full,
        # already installed by setup-windows-cross) rather than `zip`,
        # which isn't in the dep set; `7z a -tzip` from inside the dir
        # produces the same flat, root-level zip layout.
        run: |
          set -euo pipefail
          (cd dist/trailer-windows-x86_64 && 7z a -tzip ../trailer-windows-x86_64.zip .)

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-windows-x86_64
          path: dist/trailer-windows-x86_64.zip
          retention-days: 30

  macos-build:
    # Gate the expensive GitHub-hosted macOS build behind UAT and the two
    # self-hosted targets (linux-build + windows-cross) so a flaky-runner
    # rerun doesn't burn macOS action minutes until UAT passes and the
    # cheap self-hosted platforms pass. UAT is the primary fail-fast gate
    # (see the release-uat-before-build backlog item); linux-build and
    # windows-cross already gate on `uat` too, so listing them here also
    # transitively orders macos-build after UAT. precheck stays in
    # `needs:` because the `if:` below references needs.precheck.outputs.*;
    # a plain (non-always()) `if:` still requires every listed need to
    # succeed, so adding these jobs is sufficient to order macos-build
    # after them.
    needs: [precheck, uat, linux-build, windows-cross]
    if: needs.precheck.outputs.is-release-ready == 'true'
    name: macOS .app build (Apple Silicon)
    # macos-14 is Apple Silicon. The artifact is arm64-only because
    # ONNX Runtime stopped shipping macOS x86_64 / universal2
    # prebuilts (only `onnxruntime-osx-arm64-X.Y.Z.tgz` exists), and
    # ORT is on trailer's link path for ML features. Intel-Mac users
    # can build from source via scripts/build-macos.sh on their host.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        # Keep in lockstep with setup-linux-build's Qt version so CI
        # builds across platforms link against identical Qt. The
        # action exports $QT_ROOT_DIR which scripts/build-macos.sh
        # consumes. (Qt 6.11+'s macdeployqt auto-adhoc-signs the
        # bundle, which our explicit codesign step then no-ops on —
        # belt-and-suspenders for whenever this version moves.)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          modules: 'qtpdf'
          cache: true

      - name: Install build deps
        run: brew install ninja

      - name: Build, bundle, and package
        # scripts/build-macos.sh is the source of truth for the macOS
        # release build: static-universal qpdf from source, universal
        # trailer build, macdeployqt to bundle Qt frameworks, lipo +
        # otool verification, and DMG packaging. Running the same
        # script locally (`make release-macos`) produces the same
        # output, so a green local run is a strong CI signal.
        run: scripts/build-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-macos-arm64
          path: dist/trailer-macos-arm64.dmg
          retention-days: 30

  uat:
    needs: [precheck]
    if: needs.precheck.outputs.is-release-ready == 'true'
    name: UAT
    runs-on: trailer-k8s
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build UAT image
        run: docker build -t trailer-uat -f docker/uat/Dockerfile .
      - name: Run UAT suite
        # scripts/run-uat.sh --in-container does the cmake configure
        # + build + ctest -L uat dance with the right Qt platform
        # plugin available.
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 -e CTEST_PARALLEL_LEVEL=2 \
            trailer-uat \
            bash scripts/run-uat.sh --in-container
