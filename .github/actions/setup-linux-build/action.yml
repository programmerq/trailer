name: Linux build environment
description: >-
  Install Qt (install-qt-action) and the apt packages Trailer needs on
  ubuntu-24.04 (noble). qpdf 11.x ships in noble main, which is the
  minimum version Trailer's PDF forms code needs — earlier Ubuntu
  releases (22.04/jammy) shipped qpdf 10.x and broke the link with an
  `undefined reference to QPDFFormFieldObjectHelper::isChecked()`.
  clang-format is installed by the dedicated `clang-format` job, not
  here, because most consumers of this action don't need it.

inputs:
  qt-version:
    description: Qt version passed to install-qt-action
    required: false
    # Matches the default maintainer's local Qt install. Qt 6.11 is
    # non-LTS (next LTS is 6.13, est. 2026); revisit when 6.13 ships
    # if long-term-support backports matter more than aligning with
    # local dev environments. Windows is pinned separately to 6.10.3
    # in docker/windows/Dockerfile for MinGW-toolchain ABI matching;
    # bumping it requires verifying the new Qt's win64_mingw GCC
    # version still matches Ubuntu noble's mingw-w64-13.2.
    default: '6.11.0'

runs:
  using: composite
  steps:
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        modules: 'qtpdf'
        cache: true

    - name: Install Linux build deps
      # Auto-detect each dependency before installing so this action
      # works unchanged on both the stock GitHub/ARC runner image (apt
      # every run) and a custom image that bakes the toolchain in
      # (docker/runner/Dockerfile) where every package is already
      # present and apt is skipped entirely. Each dep is probed with
      # `dpkg -s` (packages) or `command -v` (tools that may live
      # outside apt, e.g. cmake in /usr/local); only the missing ones
      # are installed, and `apt-get update` runs only when there's
      # something to install.
      shell: bash
      run: |
        set -euo pipefail
        # Packages Trailer's Linux build needs. Each entry is
        # "pkg" or "pkg:command" — when a command is given it is
        # accepted as already-satisfied if `command -v` finds it
        # (covers tools installed outside apt).
        deps=(
          libgl1-mesa-dev
          libglu1-mesa-dev
          libxkbcommon-dev
          libxcb-icccm4
          libxcb-image0
          libxcb-keysyms1
          libxcb-randr0
          libxcb-render-util0
          libxcb-shape0
          libxcb-sync1
          libxcb-xfixes0
          libxcb-xinerama0
          libxcb-xkb1
          libxkbcommon-x11-0
          libcups2-dev
          "pkg-config:pkg-config"
          libqpdf-dev
          "cmake:cmake"
          "mold:mold"
          "ninja-build:ninja"
        )
        missing=()
        for entry in "${deps[@]}"; do
          pkg="${entry%%:*}"
          cmd=""
          [ "$entry" != "$pkg" ] && cmd="${entry#*:}"
          if { [ -n "$cmd" ] && command -v "$cmd" >/dev/null 2>&1; } \
             || dpkg -s "$pkg" >/dev/null 2>&1; then
            echo "  preinstalled (skipped): $pkg"
          else
            echo "  will install via apt:   $pkg"
            missing+=("$pkg")
          fi
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "All Linux build deps preinstalled — skipping apt-get."
        else
          echo "Installing ${#missing[@]} missing dep(s) via apt..."
          sudo apt-get update
          sudo apt-get install -y "${missing[@]}"
        fi
